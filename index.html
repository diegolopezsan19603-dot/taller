/* ---------------------------------------------------------
   Almacenamiento: localStorage (solo este dispositivo)
--------------------------------------------------------- */
const LS_PREFIX = "workshop-app:";

const localStorageAPI = {
  async get(key) {
    const raw = window.localStorage.getItem(LS_PREFIX + key);
    if (raw === null) return null;
    return { key, value: raw };
  },
  async set(key, value) {
    window.localStorage.setItem(LS_PREFIX + key, value);
    return { key, value };
  },
  async delete(key) {
    window.localStorage.removeItem(LS_PREFIX + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX)) {
        const short = k.slice(LS_PREFIX.length);
        if (!prefix || short.startsWith(prefix)) keys.push(short);
      }
    }
    return { keys };
  }
};

/* ---------------------------------------------------------
   Almacenamiento: Firestore (compartido entre dispositivos)
   Usa autenticación anónima: cada dispositivo entra sin
   pedir usuario/contraseña, pero queda autenticado, para que
   las reglas de Firestore puedan exigir "if request.auth != null".
--------------------------------------------------------- */
const FS_COLLECTION = "workshop_data";
let firestoreAPI = null;

if (FIREBASE_CONFIGURED) {
  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  // inMemoryPersistence evita depender de IndexedDB, que en algunos
  // navegadores móviles se bloquea o cuelga silenciosamente. Como el
  // login es anónimo y las reglas solo exigen "estar autenticado",
  // no pasa nada por re-autenticar en cada carga de página.
  const auth = initializeAuth(firebaseApp, { persistence: inMemoryPersistence });

  const authReady = new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      const online = typeof navigator !== "undefined" ? navigator.onLine : "desconocido";
      reject(new Error(
        `Tiempo de espera agotado iniciando sesión en Firebase (conexión: ${online}). Revisa la red o que el inicio de sesión anónimo esté activado en Firebase.`
      ));
    }, 15000);
    onAuthStateChanged(auth, (user) => {
      if (user) {
        clearTimeout(timeout);
        resolve(user);
      }
    });
    signInAnonymously(auth).catch((err) => {
      clearTimeout(timeout);
      reject(err);
    });
  });

  firestoreAPI = {
    async get(key) {
      await authReady;
      const snap = await getDoc(doc(db, FS_COLLECTION, key));
      if (!snap.exists()) return null;
      return { key, value: snap.data().value };
    },
    async set(key, value) {
      await authReady;
      await setDoc(doc(db, FS_COLLECTION, key), { value, updatedAt: Date.now() });
      return { key, value };
    },
    async delete(key) {
      await authReady;
      await deleteDoc(doc(db, FS_COLLECTION, key));
      return { key, deleted: true };
    },
    async list(prefix) {
      await authReady;
      const snap = await getDocs(collection(db, FS_COLLECTION));
      const keys = [];
      snap.forEach((d) => {
        if (!prefix || d.id.startsWith(prefix)) keys.push(d.id);
      });
      return { keys };
    }
  };
}

window.storage = firestoreAPI || localStorageAPI;

}
async function storageSet(key, value) {
  await window.storage.set(key, JSON.stringify(value));
  return true;
}

/* ---------------------------------------------------------
   Compresión de imágenes a base64
--------------------------------------------------------- */
function fileToCompressedDataUrl(file, maxDim = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new window.Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------
   Componente: subida de foto
--------------------------------------------------------- */
function PhotoPicker({ onPick, label = "Añadir foto", small }) {
  const cameraRef = useRef(null);
  const galleryRef = useRef(null);
  const btnRef = useRef(null);
  const [loading, setLoading] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [menuPos, setMenuPos] = useState({ top: 0, left: 0 });

  const handleChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setLoading(true);
    try {
      const dataUrl = await fileToCompressedDataUrl(file);
      onPick(dataUrl);
    } finally {
      setLoading(false);
      e.target.value = "";
    }
  };

  const MENU_WIDTH = 160; // w-40

  const openMenu = () => {
    const rect = btnRef.current?.getBoundingClientRect();
    if (rect) {
      let left = rect.left;
      // Evita que el menú se salga por la derecha de la pantalla
      if (left + MENU_WIDTH > window.innerWidth - 8) {
        left = Math.max(8, window.innerWidth - MENU_WIDTH - 8);
      }
      let top = rect.bottom + 4;
      const MENU_HEIGHT = 88; // altura aproximada del menú (2 opciones)
      // Si no cabe debajo, lo abre hacia arriba
      if (top + MENU_HEIGHT > window.innerHeight - 8) {
        top = Math.max(8, rect.top - MENU_HEIGHT - 4);
      }
      setMenuPos({ top, left });
    }
    setMenuOpen(true);
  };

  const btnClass = `inline-flex items-center gap-1.5 rounded-md border border-stone-300 bg-white font-medium text-stone-700 hover:bg-stone-50 active:scale-[0.98] transition ${
    small ? "px-2.5 py-1.5 text-xs" : "px-3 py-2 text-sm"
  }`;

  return (
    <div className="inline-block">
      <input
        ref={cameraRef}
        type="file"
        accept="image/*"
        capture="environment"
        onChange={handleChange}
        style={{ display: "none" }}
      />
      <input
        ref={galleryRef}
        type="file"
        accept="image/*"
        onChange={handleChange}
        style={{ display: "none" }}
      />
      <button
        ref={btnRef}
        type="button"
        onClick={() => (menuOpen ? setMenuOpen(false) : openMenu())}
        disabled={loading}
        className={btnClass}
      >
        <Camera size={small ? 14 : 16} />
        {loading ? "Cargando..." : label}
      </button>

      {menuOpen && !loading && createPortal(
        <>
          <div className="fixed inset-0 z-40" onClick={() => setMenuOpen(false)} />
          <div
            className="fixed z-50 bg-white rounded-lg border border-stone-200 shadow-lg overflow-hidden w-40"
            style={{ top: menuPos.top, left: menuPos.left }}
          >
            <button
              type="button"
              onClick={() => {
                setMenuOpen(false);
                cameraRef.current?.click();
              }}
              className="w-full flex items-center gap-2 px-3 py-2.5 text-xs font-medium text-stone-700 hover:bg-stone-50 text-left"
            >
              <Camera size={14} /> Hacer foto
            </button>
            <button
              type="button"
              onClick={() => {
                setMenuOpen(false);
                galleryRef.current?.click();
              }}
              className="w-full flex items-center gap-2 px-3 py-2.5 text-xs font-medium text-stone-700 hover:bg-stone-50 text-left border-t border-stone-100"
            >
              <Package size={14} /> Elegir de galería
            </button>
          </div>
        </>,
        document.body
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Hook: pull-to-refresh (arrastrar hacia abajo para recargar)
   Detecta un gesto táctil de arrastre hacia abajo cuando la
   página está en la parte superior, y llama a onRefresh().
--------------------------------------------------------- */
function usePullToRefresh(onRefresh, enabled = true) {
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startYRef = useRef(null);
  const refreshingRef = useRef(false);

  useEffect(() => {
    if (!enabled) return;

    const handleTouchStart = (e) => {
      if (refreshingRef.current) return;
      startYRef.current = window.scrollY <= 0 ? e.touches[0].clientY : null;
    };
    const handleTouchMove = (e) => {
      if (startYRef.current === null || refreshingRef.current) return;
      const distance = e.touches[0].clientY - startYRef.current;
      if (distance > 0 && window.scrollY <= 0) {
        setPullDistance(Math.min(distance * 0.5, 80));
      } else {
        setPullDistance(0);
      }
    };
    const handleTouchEnd = () => {
      if (startYRef.current === null) return;
      startYRef.current = null;
      setPullDistance((current) => {
        if (current > 50 && !refreshingRef.current) {
          refreshingRef.current = true;
          setRefreshing(true);
          Promise.resolve(onRefresh()).finally(() => {
            refreshingRef.current = false;
            setRefreshing(false);
          });
        }
        return 0;
      });
    };

    document.addEventListener("touchstart", handleTouchStart, { passive: true });
    document.addEventListener("touchmove", handleTouchMove, { passive: true });
    document.addEventListener("touchend", handleTouchEnd, { passive: true });
    return () => {
      document.removeEventListener("touchstart", handleTouchStart);
      document.removeEventListener("touchmove", handleTouchMove);
      document.removeEventListener("touchend", handleTouchEnd);
    };
  }, [enabled, onRefresh]);

  return { pullDistance, refreshing };
}

/* ---------------------------------------------------------
   Pantalla de detalle de vehículo
--------------------------------------------------------- */
function CarDetail({ car, onBack, onUpdate, onDelete }) {
  const [localCar, setLocalCar] = useState(car);
  const carRef = useRef(car);
  const onUpdateRef = useRef(onUpdate);
  const [listening, setListening] = useState(false);
  const [dictationError, setDictationError] = useState(null);
  const recognitionRef = useRef(null);
  const speechSupported =
    typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  useEffect(() => setLocalCar(car), [car.id]);
  useEffect(() => {
    carRef.current = localCar;
  }, [localCar]);
  useEffect(() => {
    onUpdateRef.current = onUpdate;
  }, [onUpdate]);

  const patch = useCallback(
    (fields) => {
      const updated = { ...localCar, ...fields, updatedAt: Date.now() };
      setLocalCar(updated);
      onUpdate(updated);
    },
    [localCar, onUpdate]
  );

  const toggleDictation = () => {
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionImpl) return;

    if (listening) {
      recognitionRef.current && recognitionRef.current.stop();
      return;
    }

    setDictationError(null);

    if (typeof window.isSecureContext !== "undefined" && !window.isSecureContext) {
      setDictationError(
        "El dictado por voz solo funciona con conexión segura (https)."
      );
      return;
    }

    const recognition = new SpeechRecognitionImpl();
    recognition.lang = "es-ES";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      let finalText = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      }
      if (finalText.trim()) {
        const addition = finalText.trim().toUpperCase();
        const prevNotes = carRef.current.notes || "";
        const updated = {
          ...carRef.current,
          notes: prevNotes ? prevNotes + " " + addition : addition,
          updatedAt: Date.now(),
        };
        carRef.current = updated;
        setLocalCar(updated);
        onUpdateRef.current(updated);
      }
    };
    recognition.onerror = (event) => {
      setListening(false);
      const errorMessages = {
        "not-allowed": "Permiso de micrófono denegado. Revisa los permisos del navegador para esta página.",
        "service-not-allowed": "El navegador ha bloqueado el micrófono (puede requerir https).",
        network: "Sin conexión a internet: el dictado por voz necesita red para funcionar.",
        "no-speech": "No se ha detectado voz. Inténtalo de nuevo hablando más cerca del micrófono.",
        "audio-capture": "No se ha encontrado ningún micrófono en este dispositivo.",
        aborted: null,
      };
      const msg = event && event.error ? errorMessages[event.error] : null;
      if (msg !== null) {
        setDictationError(msg || `Error de dictado: ${event ? event.error : "desconocido"}`);
      }
    };
    recognition.onend = () => setListening(false);

    try {
      recognitionRef.current = recognition;
      recognition.start();
      setListening(true);
    } catch (err) {
      setListening(false);
      setDictationError((err && err.message) || "No se pudo iniciar el dictado por voz.");
    }
  };

  useEffect(() => {
    return () => {
      recognitionRef.current && recognitionRef.current.stop();
    };
  }, []);

  const addPart = () => {
    patch({
      parts: [
        ...localCar.parts,
        { id: uid(), name: "", status: "pedir", supplier: "", photo: null },
      ],
    });

/* ---------------------------------------------------------
   Pantalla: lista / bandeja
--------------------------------------------------------- */
function CarListScreen({ cars, onOpen, onCreate, onRefresh, filter, setFilter, query, setQuery }) {
  const { pullDistance, refreshing } = usePullToRefresh(onRefresh, true);
  const [manualRefreshing, setManualRefreshing] = useState(false);
  const [isFullscreen, setIsFullscreen] = useState(!!document.fullscreenElement);

  useEffect(() => {
    const handleChange = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", handleChange);
    return () => document.removeEventListener("fullscreenchange", handleChange);
  }, []);

  const toggleFullscreen = async () => {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await document.documentElement.requestFullscreen();
      }
    } catch (err) {
      console.error("No se pudo cambiar el modo pantalla completa:", err);
    }
  };

  const handleManualRefresh = async () => {
    setManualRefreshing(true);
    await onRefresh();
    setManualRefreshing(false);
  };

  const filtered = cars
    .filter((c) => (filter === "pendiente" ? c.status !== "terminado" : c.status === "terminado"))
    .filter((c) => {
      if (!query.trim()) return true;
      const q = query.toLowerCase();
      return (
        c.plate?.toLowerCase().includes(q) ||
        c.brand?.toLowerCase().includes(q) ||
        c.model?.toLowerCase().includes(q) ||
        c.clientName?.toLowerCase().includes(q)
      );
    })
    .sort((a, b) => b.updatedAt - a.updatedAt);

  const pendingCount = cars.filter((c) => c.status !== "terminado").length;
  const doneCount = cars.filter((c) => c.status === "terminado").length;

  const indicatorHeight = refreshing ? 44 : pullDistance;

  return (
    <div className="min-h-screen bg-stone-100">
      <div
        className="flex items-center justify-center overflow-hidden transition-[height] duration-150 ease-out bg-stone-100"
        style={{ height: indicatorHeight }}
      >
        <RefreshCw
          size={18}
          className={`text-black ${refreshing ? "animate-spin" : ""}`}
          style={!refreshing ? { transform: `rotate(${pullDistance * 3}deg)` } : undefined}
        />
      </div>
      <div className="sticky top-0 z-10 bg-stone-900 text-white px-4 pt-4 pb-3 shadow">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center">
              <Wrench size={16} className="text-stone-900" />
            </div>
            <div>
              <p className="font-semibold leading-tight uppercase">Taller</p>
              <p className="text-[11px] text-white/80 leading-tight flex items-center gap-1 uppercase">
                <span
                  className={`w-1.5 h-1.5 rounded-full inline-block ${
                    FIREBASE_CONFIGURED ? "bg-green-500" : "bg-amber-500"
                  }`}
                />
                {FIREBASE_CONFIGURED ? "Sincronizado" : "Solo este dispositivo"}
              </p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <button
              onClick={toggleFullscreen}
              aria-label={isFullscreen ? "Salir de pantalla completa" : "Pantalla completa"}
              className="text-white"
            >
              {isFullscreen ? <Minimize2 size={17} /> : <Maximize2 size={17} />}
            </button>
            <button
              onClick={handleManualRefresh}
              aria-label="Actualizar"
              className="text-white"
            >
              <RefreshCw size={17} className={manualRefreshing ? "animate-spin" : ""} />
            </button>
          </div>
        </div>

        <div className="relative mb-3">
          <Search size={15} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-white/70" />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="BUSCAR POR MATRÍCULA, MARCA O CLIENTE..."
            className="w-full pl-8 pr-3 py-2 text-sm uppercase rounded-lg bg-stone-800 border border-stone-700 text-white placeholder-white/50 outline-none focus:border-amber-500"
          />
        </div>

        <div className="flex gap-2">
          <button
            onClick={() => setFilter("pendiente")}
            className={`flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-sm font-bold uppercase transition ${
              filter === "pendiente" ? "bg-amber-500 text-stone-900" : "bg-stone-800 text-white"
            }`}
          >
            <Clock size={14} /> Pendientes ({pendingCount})
          </button>
          <button
            onClick={() => setFilter("terminado")}
            className={`flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-sm font-bold uppercase transition ${
              filter === "terminado" ? "bg-green-500 text-stone-900" : "bg-stone-800 text-white"
            }`}
          >
            <CheckCircle2 size={14} /> Terminados ({doneCount})
          </button>
        </div>
      </div>

      <div className="p-4 max-w-lg mx-auto">
        <button
          onClick={onCreate}
          className="w-full flex items-center justify-center gap-2 py-3 mb-4 rounded-xl border-2 border-dashed border-stone-300 text-black font-bold uppercase hover:border-amber-400 hover:text-amber-600 transition"
        >
          <Plus size={18} /> Registrar nuevo vehículo
        </button>

        {filtered.length === 0 ? (
          <div className="text-center py-12">
            <AlertCircle size={28} className="mx-auto text-black mb-2" />
            <p className="text-sm font-medium text-black uppercase">
              {query
                ? "No hay vehículos que coincidan con la búsqueda."
                : filter === "pendiente"
                ? "No hay vehículos pendientes."
                : "Todavía no hay vehículos terminados."}
            </p>
          </div>
        ) : (
          <div className="space-y-2.5">
            {filtered.map((car) => (
              <CarListItem key={car.id} car={car} onOpen={onOpen} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

const CARS_INDEX_KEY = "workshop:cars:index";
const carKey = (id) => `workshop:cars:${id}`;

function App() {
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [cars, setCars] = useState([]);
  const [openId, setOpenId] = useState(null);
  const [filter, setFilter] = useState("pendiente");
  const [query, setQuery] = useState("");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [saveError, setSaveError] = useState(null);
  const [confirmExit, setConfirmExit] = useState(false);
  const openIdRef = useRef(openId);

  useEffect(() => {
    openIdRef.current = openId;
  }, [openId]);

  // Gestión del botón "atrás" del navegador/móvil:
  // - Si hay un vehículo abierto, "atrás" vuelve a la lista principal.
  // - Si estamos en la lista principal, "atrás" pide confirmación antes de salir.
  const exitingRef = useRef(false);

  useEffect(() => {
    // Estado base para poder interceptar el "atrás" incluso en la pantalla inicial.
    window.history.pushState({ screen: "list" }, "");

    const handlePopState = () => {
      if (exitingRef.current) {
        // El usuario ya confirmó que quiere salir: dejamos que el navegador
        // continúe hacia atrás de verdad, sin volver a interceptarlo.
        return;
      }
      if (openIdRef.current) {
        // Estábamos en el detalle: volvemos a la lista y reponemos el estado base.
        setOpenId(null);
        window.history.pushState({ screen: "list" }, "");
      } else {
        // Estábamos en la lista: preguntamos antes de salir.
        setConfirmExit(true);
        window.history.pushState({ screen: "list" }, "");
      }
    };

    window.addEventListener("popstate", handlePopState);
    return () => window.removeEventListener("popstate", handlePopState);
  }, []);

  const openCarDetail = (id) => {
    window.history.pushState({ screen: "detail" }, "");
    setOpenId(id);
  };

  const closeCarDetail = () => {
    window.history.back();
  };

  const confirmExitApp = () => {
    setConfirmExit(false);
    exitingRef.current = true;
    // Intento directo de cerrar la pestaña (solo funciona si el navegador lo permite,
    // por ejemplo si esta pestaña fue abierta por un enlace desde otra app).
    window.close();
    // Si el navegador no permite cerrarla (lo habitual), retrocedemos de verdad
    // en el historial para salir del sitio, ahora que ya no se interceptará.
    setTimeout(() => {
      window.history.back();
    }, 50);
  };

  const loadData = async ({ silent } = {}) => {
    if (!silent) {
      setLoading(true);
      setLoadError(null);
    }
    try {
      const index = (await storageGet(CARS_INDEX_KEY)) || [];
      const loaded = [];
      for (const id of index) {
        const c = await storageGet(carKey(id));
        if (c) loaded.push(c);
      }
      setCars(loaded);
      if (!silent) setLoading(false);
    } catch (err) {
      console.error("Error cargando datos:", err);
      if (silent) {
        setSaveStatus("error");
        setSaveError((err && err.message) || String(err));
      } else {
        setLoadError((err && err.message) || String(err));
        setLoading(false);
      }
    }
  };

  useEffect(() => {
    loadData();
  }, []);

  const handleRefresh = useCallback(() => loadData({ silent: true }), []);

  const persistIndex = async (list) => {
    try {
      await storageSet(
        CARS_INDEX_KEY,
        list.map((c) => c.id)
      );
    } catch (err) {
      console.error("Error guardando índice:", err);
      setSaveStatus("error");
      setSaveError((err && err.message) || String(err));
    }
  };

  const saveCar = async (car) => {
    setSaveStatus("saving");
    try {
      await storageSet(carKey(car.id), car);
      setSaveStatus("saved");
      setSaveError(null);
      setTimeout(() => setSaveStatus("idle"), 1200);
    } catch (err) {
      console.error("Error guardando coche:", err);
      setSaveStatus("error");
      setSaveError((err && err.message) || String(err));
    }
  };

  const handleCreate = async () => {
    const newCar = {
      id: uid(),
      brand: "",
      model: "",
      plate: "",
      km: "",
      clientName: "",
      clientPhone: "",
      parts: [],
      photos: [],
      clientPhotos: [],
      laborHours: "",
      mechanic: "",
      notes: "",
      status: "pendiente",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      finishedAt: null,
    };
    const updated = [...cars, newCar];
    setCars(updated);
    openCarDetail(newCar.id);
    await saveCar(newCar);
    await persistIndex(updated);
  };

  const handleUpdateCar = async (updatedCar) => {
    setCars((prev) => prev.map((c) => (c.id === updatedCar.id ? updatedCar : c)));
    await saveCar(updatedCar);
  };

  const handleDeleteCar = async (id) => {
    const updated = cars.filter((c) => c.id !== id);
    setCars(updated);
    setOpenId(null);
    await persistIndex(updated);
  };

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-100">
        <p className="text-black text-sm font-medium uppercase">Cargando taller...</p>
      </div>
    );
  }

  if (loadError) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-100 px-6">
        <div className="max-w-sm w-full bg-white border border-red-200 rounded-xl p-5 text-center">
          <AlertCircle className="mx-auto text-red-500 mb-2" size={28} />
          <p className="text-stone-700 font-medium mb-1">No se pudieron cargar los datos</p>
          <p className="text-sm text-black break-words mb-4">{loadError}</p>
          <button
            onClick={loadData}
            className="w-full bg-amber-500 text-white text-sm font-medium py-2 rounded-lg hover:bg-amber-600 transition"
          >
            Reintentar
          </button>
        </div>
      </div>
    );
  }

  const openCar = cars.find((c) => c.id === openId);

  return (
    <div className="relative">
      {openCar ? (
        <CarDetail
          car={openCar}
          onBack={closeCarDetail}
          onUpdate={handleUpdateCar}
          onDelete={handleDeleteCar}
        />
      ) : (
        <CarListScreen
          cars={cars}
          onOpen={openCarDetail}
          onCreate={handleCreate}
          onRefresh={handleRefresh}
          filter={filter}
          setFilter={setFilter}
          query={query}
          setQuery={setQuery}
        />
      )}

      {confirmExit && (
        <div className="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl p-5 max-w-sm w-full text-center shadow-xl">
            <AlertCircle className="mx-auto text-amber-500 mb-2" size={28} />
            <p className="text-black font-bold mb-4">¿Seguro que quieres salir?</p>
            <div className="flex gap-3">
              <button
                onClick={() => setConfirmExit(false)}
                className="flex-1 py-2.5 rounded-lg border-2 border-stone-300 text-black font-bold uppercase"
              >
                No
              </button>
              <button
                onClick={confirmExitApp}
                className="flex-1 py-2.5 rounded-lg bg-red-600 text-white font-bold uppercase"
              >
                Sí
              </button>
            </div>
          </div>
        </div>
      )}

      {saveStatus !== "idle" && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 max-w-[92vw]">
          <div
            className={`text-xs font-medium px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 ${
              saveStatus === "saving"
                ? "bg-stone-800 text-white"
                : saveStatus === "error"
                ? "bg-red-600 text-white"
                : "bg-green-600 text-white"
            }`}
          >
            {saveStatus === "saving" && <>Guardando...</>}
            {saveStatus === "saved" && (
              <>
                <Check size={12} /> Guardado
              </>
            )}
            {saveStatus === "error" && (
              <>
                <AlertCircle size={12} className="flex-shrink-0" />
                <span className="truncate">Error al guardar: {saveError}</span>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
