/* ---------------------------------------------------------
   Hook: pull-to-refresh (arrastrar hacia abajo para recargar)
   Detecta un gesto táctil de arrastre hacia abajo cuando la
   página está en la parte superior, y llama a onRefresh().
--------------------------------------------------------- */
function usePullToRefresh(onRefresh, enabled = true) {
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startYRef = useRef(null);
  const refreshingRef = useRef(false);

  useEffect(() => {
    if (!enabled) return;

    const handleTouchStart = (e) => {
      if (refreshingRef.current) return;
      startYRef.current = window.scrollY <= 0 ? e.touches[0].clientY : null;
    };
    const handleTouchMove = (e) => {
      if (startYRef.current === null || refreshingRef.current) return;
      const distance = e.touches[0].clientY - startYRef.current;
      if (distance > 0 && window.scrollY <= 0) {
        setPullDistance(Math.min(distance * 0.5, 80));
      } else {
        setPullDistance(0);
      }
    };
    const handleTouchEnd = () => {
      if (startYRef.current === null) return;
      startYRef.current = null;
      setPullDistance((current) => {
        if (current > 50 && !refreshingRef.current) {
          refreshingRef.current = true;
          setRefreshing(true);
          Promise.resolve(onRefresh()).finally(() => {
            refreshingRef.current = false;
            setRefreshing(false);
          });
        }
        return 0;
      });
    };

    document.addEventListener("touchstart", handleTouchStart, { passive: true });
    document.addEventListener("touchmove", handleTouchMove, { passive: true });
    document.addEventListener("touchend", handleTouchEnd, { passive: true });
    return () => {
      document.removeEventListener("touchstart", handleTouchStart);
      document.removeEventListener("touchmove", handleTouchMove);
      document.removeEventListener("touchend", handleTouchEnd);
    };
  }, [enabled, onRefresh]);

  return { pullDistance, refreshing };
}

/* ---------------------------------------------------------
   Estado de pieza
--------------------------------------------------------- */
const PART_STATES = {
  pedir: { label: "Pedir", shortLabel: "Pedir", color: "bg-red-100 text-red-800 border-red-300", dot: "bg-red-500" },
  pedido: { label: "Pedido", shortLabel: "Pedido", color: "bg-amber-100 text-amber-800 border-amber-300", dot: "bg-amber-500" },
  recibido: { label: "Recibido", shortLabel: "Recibido", color: "bg-green-100 text-green-800 border-green-300", dot: "bg-green-500" },
  recambio: { label: "Recambio", shortLabel: "Recam.", color: "bg-blue-100 text-blue-800 border-blue-300", dot: "bg-blue-500" },
};

/* ---------------------------------------------------------
   Tarjeta de pieza individual
--------------------------------------------------------- */
const SUPPLIER_OPTIONS = ["Indalo", "A.R.Vera", "Ad Salas"];

function PartCard({ part, onUpdate, onDelete, onOpenPhoto }) {
  const isCustomSupplier = !!part.supplier && !SUPPLIER_OPTIONS.includes(part.supplier);
  const [showCustomSupplier, setShowCustomSupplier] = useState(isCustomSupplier);
  const [customSupplier, setCustomSupplier] = useState(isCustomSupplier ? part.supplier : "");
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [listeningName, setListeningName] = useState(false);
  const nameRecognitionRef = useRef(null);
  const partRef = useRef(part);
  useEffect(() => {
    partRef.current = part;
  }, [part]);
  const speechSupportedName =
    typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const state = PART_STATES[part.status];

  const toggleNameDictation = () => {
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionImpl) return;

    if (listeningName) {
      nameRecognitionRef.current && nameRecognitionRef.current.stop();
      return;
    }

    const recognition = new SpeechRecognitionImpl();
    recognition.lang = "es-ES";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      let finalText = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      }
      if (finalText.trim()) {
        const addition = finalText.trim().toUpperCase();
        const prevName = partRef.current.name || "";
        onUpdate({ ...partRef.current, name: prevName ? prevName + " " + addition : addition });
      }
    };
    recognition.onerror = () => setListeningName(false);
    recognition.onend = () => setListeningName(false);

    try {
      nameRecognitionRef.current = recognition;
      recognition.start();
      setListeningName(true);
    } catch (err) {
      setListeningName(false);
    }
  };

  useEffect(() => {
    return () => {
      nameRecognitionRef.current && nameRecognitionRef.current.stop();
    };
  }, []);

  const nameTextareaRef = useRef(null);
  useEffect(() => {
    if (nameTextareaRef.current) {
      nameTextareaRef.current.style.height = "auto";
      nameTextareaRef.current.style.height = nameTextareaRef.current.scrollHeight + "px";
    }
  }, [part.name]);

  return (
    <div className="bg-white rounded-lg border-2 border-stone-200 overflow-hidden">
      <div className="p-3.5">
        <div className="flex items-start gap-2 mb-2.5">
          <UppercaseField
            as="textarea"
            inputRef={nameTextareaRef}
            value={part.name}
            onChange={(val) => onUpdate({ ...part, name: val })}
            placeholder="NOMBRE DE LA PIEZA"
            rows={1}
            onInput={(e) => {
              e.target.style.height = "auto";
              e.target.style.height = e.target.scrollHeight + "px";
            }}
            className="flex-1 min-w-0 text-base font-bold text-black uppercase border-none outline-none bg-transparent placeholder-stone-400 resize-none overflow-hidden break-words"
          />
          {speechSupportedName && (
            <button
              type="button"
              onClick={toggleNameDictation}
              aria-label={listeningName ? "Detener dictado" : "Dictar nombre de la pieza"}
              className={`flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-lg border-2 transition ${
                listeningName
                  ? "bg-red-600 text-white border-red-600 animate-pulse"
                  : "bg-white text-amber-600 border-stone-300 hover:border-amber-400 hover:text-amber-700"
              }`}
            >
              {listeningName ? <MicOff size={19} /> : <Mic size={19} />}
            </button>
          )}
          <button
            onClick={() => setConfirmDelete(true)}
            aria-label="Eliminar pieza"
            className="text-black hover:text-red-500 flex-shrink-0 p-1.5"
          >
            <Trash2 size={20} />
          </button>
        </div>

        <div className="flex items-start gap-3">
          <div className="flex-shrink-0">
            {part.photo ? (
              <div className="relative">
                <img
                  src={part.photo.thumb || part.photo.data}
                  alt=""
                  onClick={() => onOpenPhoto(part.photo.id)}
                  className="w-24 h-24 object-cover rounded-md border border-stone-300 cursor-pointer"
                />
                <button
                  onClick={() => onUpdate({ ...part, photo: null })}
                  aria-label="Eliminar foto de la pieza"
                  className="absolute -top-2 -right-2 w-7 h-7 rounded-full bg-red-600 text-white flex items-center justify-center shadow"
                >
                  <X size={14} />
                </button>
              </div>
            ) : (
              <div className="w-24 h-24 flex items-center justify-center">
                <PhotoPicker
                  small
                  label=""
                  onPick={(photo) => onUpdate({ ...part, photo })}
                />
              </div>
            )}
          </div>

          <div className="flex-1 min-w-0">
            <div className="grid grid-cols-2 gap-2">
              {Object.entries(PART_STATES).map(([key, s]) => (
                <button
                  key={key}
                  onClick={() => onUpdate({ ...part, status: key })}
                  className={`w-full text-sm px-2 py-2 rounded-lg border-2 font-bold uppercase text-center leading-tight transition ${
                    part.status === key ? s.color : "bg-stone-50 text-black border-stone-200"
                  }`}
                >
                  {s.shortLabel}
                </button>
              ))}
            </div>

            {(part.status === "pedido" || part.status === "recibido") && (
              <div className="mt-2.5 space-y-1.5">
                <select
                  value={showCustomSupplier ? "Otro" : (part.supplier || "")}
                  onChange={(e) => {
                    const val = e.target.value;
                    if (val === "Otro") {
                      setShowCustomSupplier(true);
                      onUpdate({ ...part, supplier: customSupplier });
                    } else {
                      setShowCustomSupplier(false);
                      onUpdate({ ...part, supplier: val });
                    }
                  }}
                  className="w-full text-sm px-2.5 py-2 rounded-md border-2 border-stone-300 outline-none focus:border-amber-500 uppercase text-black font-medium bg-white"
                >
                  <option value="">PEDIDO EN...</option>
                  {SUPPLIER_OPTIONS.map((opt) => (
                    <option key={opt} value={opt}>
                      {opt.toUpperCase()}
                    </option>
                  ))}
                  <option value="Otro">OTRO:</option>
                </select>
                {showCustomSupplier && (
                  <input
                    autoFocus
                    value={customSupplier}
                    onChange={(e) => {
                      const val = e.target.value.toUpperCase();
                      setCustomSupplier(val);
                      onUpdate({ ...part, supplier: val });
                    }}
                    placeholder="ESCRIBE EL PROVEEDOR"
                    className="w-full text-sm px-2.5 py-2 rounded-md border-2 border-stone-300 outline-none focus:border-amber-500 uppercase text-black font-medium"
                  />
                )}
              </div>
            )}
          </div>
        </div>
      </div>
      <ConfirmDialog
        open={confirmDelete}
        message="¿Seguro que quieres eliminarlo?"
        onConfirm={() => {
          onDelete(part.id);
          setConfirmDelete(false);
        }}
        onCancel={() => setConfirmDelete(false)}
      />
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla de detalle de vehículo
--------------------------------------------------------- */
function CarDetail({ car, onBack, onUpdate, onDelete }) {
  const [localCar, setLocalCar] = useState(car);
  const carRef = useRef(car);
  const onUpdateRef = useRef(onUpdate);
  const saveTimeoutRef = useRef(null);
  const [listening, setListening] = useState(false);
  const [dictationError, setDictationError] = useState(null);
  const recognitionRef = useRef(null);
  const speechSupported =
    typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  // Lista única con TODAS las fotos de la orden (vehículo, cliente y
  // piezas), en ese orden, para que el visor pueda deslizarse entre
  // todas ellas sin separarlas por categoría. Cada foto de pieza lleva
  // su proveedor (si lo tiene) para mostrarlo dentro del visor.
  const allOrderPhotos = useMemo(() => {
    const carPhotos = (localCar.photos || []).map((p) => ({ ...p, supplier: null }));
    const clientPhotos = (localCar.clientPhotos || []).map((p) => ({ ...p, supplier: null }));
    const partPhotos = (localCar.parts || [])
      .filter((part) => part.photo)
      .map((part) => ({ ...part.photo, supplier: part.supplier || null }));
    return [...carPhotos, ...clientPhotos, ...partPhotos];
  }, [localCar.photos, localCar.clientPhotos, localCar.parts]);

  const [lightboxIndex, setLightboxIndex] = useState(null);
  const openLightboxByPhotoId = (photoId) => {
    const idx = allOrderPhotos.findIndex((p) => p.id === photoId);
    if (idx !== -1) setLightboxIndex(idx);
  };

  useEffect(() => setLocalCar(car), [car.id]);
  useEffect(() => {
    carRef.current = localCar;
  }, [localCar]);
  useEffect(() => {
    onUpdateRef.current = onUpdate;
  }, [onUpdate]);

  // Al desmontar (p.ej. al volver atrás), si hay un guardado pendiente,
  // lo lanzamos ya mismo para no perder el último cambio.
  useEffect(() => {
    return () => {
      if (saveTimeoutRef.current) {
        clearTimeout(saveTimeoutRef.current);
        onUpdateRef.current(carRef.current);
      }
    };
  }, []);

  // Al ocultarse la app (cambiar de app, bloquear el móvil, cerrar la pestaña)
  // se guarda al momento cualquier cambio que estuviera esperando el retardo
  // de 600 ms.
  useEffect(() => {
    const flushPending = () => {
      if (saveTimeoutRef.current) {
        clearTimeout(saveTimeoutRef.current);
        saveTimeoutRef.current = null;
        onUpdateRef.current(carRef.current);
      }
    };
    const onVisibility = () => {
      if (document.visibilityState === "hidden") flushPending();
    };
    document.addEventListener("visibilitychange", onVisibility);
    window.addEventListener("pagehide", flushPending);
    return () => {
      document.removeEventListener("visibilitychange", onVisibility);
      window.removeEventListener("pagehide", flushPending);
    };
  }, []);

  // Cuando el código de orden (OT-xxxx) se asigna al sincronizar un coche
  // creado sin conexión, se refleja en la ficha abierta.
  useEffect(() => {
    if (car.orderCode && !carRef.current.orderCode) {
      carRef.current = { ...carRef.current, orderCode: car.orderCode };
      setLocalCar((l) => (l.orderCode ? l : { ...l, orderCode: car.orderCode }));
    }
  }, [car.orderCode]);

  const patch = useCallback(
    (fields) => {
      // Se parte SIEMPRE de la última versión (carRef), no de la de este
      // render: una foto tarda unos instantes en procesarse y, mientras,
      // el mecánico puede haber escrito otra cosa que no debe perderse.
      const updated = { ...carRef.current, ...fields, updatedAt: Date.now() };
      carRef.current = updated;
      setLocalCar(updated);

      // Debounce: la UI se actualiza al instante, pero el guardado real
      // (a Firestore) espera a que el usuario deje de escribir/cambiar
      // cosas durante 600ms, para no mandar una escritura completa del
      // coche (con fotos incluidas) en cada pulsación de tecla.
      if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
      saveTimeoutRef.current = setTimeout(() => {
        saveTimeoutRef.current = null;
        onUpdateRef.current(carRef.current);
      }, 600);
    },
    [localCar]
  );

  // Para cambios que deben guardarse YA (no esperar el debounce): p.ej.
  // marcar como terminado, borrar una pieza, etc. Usa esto en vez de
  // patch() cuando el cambio sea "de un solo golpe" y quieras confirmación
  // inmediata.
  const patchNow = useCallback(
    (fields) => {
      if (saveTimeoutRef.current) {
        clearTimeout(saveTimeoutRef.current);
        saveTimeoutRef.current = null;
      }
      const updated = { ...carRef.current, ...fields, updatedAt: Date.now() };
      carRef.current = updated;
      setLocalCar(updated);
      onUpdateRef.current(updated);
    },
    [localCar]
  );

  const toggleDictation = () => {
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionImpl) return;

    if (listening) {
      recognitionRef.current && recognitionRef.current.stop();
      return;
    }

    setDictationError(null);

    if (typeof window.isSecureContext !== "undefined" && !window.isSecureContext) {
      setDictationError(
        "El dictado por voz solo funciona con conexión segura (https)."
      );
      return;
    }

    const recognition = new SpeechRecognitionImpl();
    recognition.lang = "es-ES";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      let finalText = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      }
      if (finalText.trim()) {
        const addition = finalText.trim().toUpperCase();
        const prevNotes = carRef.current.notes || "";
        const updated = {
          ...carRef.current,
          notes: prevNotes ? prevNotes + " " + addition : addition,
          updatedAt: Date.now(),
        };
        carRef.current = updated;
        setLocalCar(updated);
        onUpdateRef.current(updated);
      }
    };
    recognition.onerror = (event) => {
      setListening(false);
      const errorMessages = {
        "not-allowed": "Permiso de micrófono denegado. Revisa los permisos del navegador para esta página.",
        "service-not-allowed": "El navegador ha bloqueado el micrófono (puede requerir https).",
        network: "Sin conexión a internet: el dictado por voz necesita red para funcionar.",
        "no-speech": "No se ha detectado voz. Inténtalo de nuevo hablando más cerca del micrófono.",
        "audio-capture": "No se ha encontrado ningún micrófono en este dispositivo.",
        aborted: null,
      };
      const msg = event && event.error ? errorMessages[event.error] : null;
      if (msg !== null) {
        setDictationError(msg || `Error de dictado: ${event ? event.error : "desconocido"}`);
      }
    };
    recognition.onend = () => setListening(false);

    try {
      recognitionRef.current = recognition;
      recognition.start();
      setListening(true);
    } catch (err) {
      setListening(false);
      setDictationError((err && err.message) || "No se pudo iniciar el dictado por voz.");
    }
  };

  useEffect(() => {
    return () => {
      recognitionRef.current && recognitionRef.current.stop();
    };
  }, []);

  const addPart = () => {
    patch({
      parts: [
        ...localCar.parts,
        { id: uid(), name: "", status: "pedir", supplier: "", photo: null },
      ],
    });
  };
  const updatePart = (part) => {
    patch({ parts: localCar.parts.map((p) => (p.id === part.id ? part : p)) });
  };
  const deletePart = (id) => {
    patchNow({ parts: localCar.parts.filter((p) => p.id !== id) });
  };

  const addPhoto = (photo) => {
    patchNow({ photos: [...(carRef.current.photos || []), photo] });
  };
  const deletePhoto = (id) => {
    patchNow({ photos: localCar.photos.filter((p) => p.id !== id) });
  };

  const addClientPhoto = (photo) => {
    patchNow({ clientPhotos: [...(carRef.current.clientPhotos || []), photo] });
  };
  const deleteClientPhoto = (id) => {
    patchNow({ clientPhotos: (localCar.clientPhotos || []).filter((p) => p.id !== id) });
  };

  const [confirmDelete, setConfirmDelete] = useState(false);

  return (
    <div className="min-h-screen bg-stone-100">
      <div className="sticky top-0 z-10 bg-stone-900 text-white px-4 py-3 flex items-center gap-3 shadow">
        <button onClick={onBack} aria-label="Volver">
          <ChevronLeft size={22} />
        </button>
        <div className="flex-1 min-w-0">
          <p className="font-semibold truncate uppercase">
            {localCar.orderCode || "ORDEN DE REPARACIÓN"}
          </p>
        </div>
        {localCar.status === "terminado" ? (
          <span className="flex items-center gap-1 text-xs font-medium bg-green-500/20 text-green-300 px-2.5 py-1 rounded-full border border-green-500/30 uppercase">
            <CheckCircle2 size={13} /> Terminado
          </span>
        ) : (
          <span className="flex items-center gap-1 text-xs font-medium bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full border border-amber-500/30 uppercase">
            <Clock size={13} /> Pendiente
          </span>
        )}
      </div>

      <div className="p-4 space-y-4 max-w-lg mx-auto">
        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <h2 className="text-sm font-bold text-black uppercase tracking-wide mb-3">
            Mecánico
          </h2>
          <select
            value={localCar.mechanic || ""}
            onChange={(e) => patch({ mechanic: e.target.value })}
            className="w-full px-3 py-3 text-base font-bold text-black uppercase rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500 bg-white"
          >
            <option value="">SIN ASIGNAR</option>
            <option value="Francisco">FRANCISCO</option>
            <option value="Alfonso">ALFONSO</option>
            <option value="Ginés">GINÉS</option>
            <option value="Ramón">RAMÓN</option>
          </select>
        </section>

        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <h2 className="text-sm font-bold text-black uppercase tracking-wide mb-3">
            Vehículo
          </h2>
          <div className="space-y-3">
            <div>
              <label className="text-sm font-semibold text-black flex items-center gap-1">
                <Car size={14} /> Matrícula
              </label>
              <UppercaseField
                value={localCar.plate}
                onChange={(val) => patch({ plate: val })}
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black uppercase rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            <div>
              <label className="text-sm font-semibold text-black flex items-center gap-1">
                <Gauge size={14} /> Kilómetros
              </label>
              <input
                type="number"
                inputMode="numeric"
                value={localCar.km}
                onChange={(e) => patch({ km: e.target.value })}
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            <div>
              <h3 className="text-sm font-semibold text-black mb-2">Fotos del vehículo</h3>
              <PhotoGallery
                photos={localCar.photos}
                onDelete={deletePhoto}
                onAdd={addPhoto}
                onOpen={openLightboxByPhotoId}
              />
            </div>
          </div>
        </section>

        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <h2 className="text-sm font-bold text-black uppercase tracking-wide mb-3">
            Cliente
          </h2>
          <div className="space-y-3">
            <div>
              <label className="text-sm font-semibold text-black flex items-center gap-1">
                <User size={14} /> Nombre
              </label>
              <UppercaseField
                value={localCar.clientName}
                onChange={(val) => patch({ clientName: val })}
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black uppercase rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            <div>
              <label className="text-sm font-semibold text-black flex items-center gap-1">
                <Phone size={14} /> Teléfono
              </label>
              <input
                value={localCar.clientPhone}
                onChange={(e) => patch({ clientPhone: e.target.value })}
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            <div>
              <h3 className="text-sm font-semibold text-black mb-2">Fotos del cliente</h3>
              <PhotoGallery
                photos={localCar.clientPhotos || []}
                onDelete={deleteClientPhoto}
                onAdd={addClientPhoto}
                onOpen={openLightboxByPhotoId}
              />
            </div>
          </div>
        </section>

        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-black uppercase tracking-wide flex items-center gap-1.5">
              <Package size={16} /> Piezas de recambio
            </h2>
            <button
              onClick={addPart}
              className="flex items-center gap-1.5 text-sm font-bold text-amber-700 bg-amber-50 border-2 border-amber-200 px-3 py-2 rounded-lg hover:bg-amber-100"
            >
              <Plus size={16} /> Añadir pieza
            </button>
          </div>
          {localCar.parts.length === 0 ? (
            <p className="text-base font-medium text-black text-center py-6">
              Sin piezas registradas todavía.
            </p>
          ) : (
            <div className="space-y-2">
              {localCar.parts.map((part) => (
                <PartCard
                  key={part.id}
                  part={part}
                  onUpdate={updatePart}
                  onDelete={deletePart}
                  onOpenPhoto={openLightboxByPhotoId}
                />
              ))}
            </div>
          )}
        </section>

        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <h2 className="text-sm font-bold text-black uppercase tracking-wide mb-3 flex items-center gap-1.5">
            <ClipboardList size={16} /> Mano de obra y trabajo realizado
          </h2>
          <div className="flex items-end gap-3 mb-3">
            <div className="flex-1">
              <label className="text-sm font-semibold text-black">Horas estimadas</label>
              <input
                type="number"
                step="0.5"
                value={localCar.laborHours}
                onChange={(e) => patch({ laborHours: e.target.value })}
                placeholder="0"
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            {speechSupported && (
              <button
                type="button"
                onClick={toggleDictation}
                aria-label={listening ? "Detener dictado" : "Dictar por voz"}
                className={`flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-lg border-2 transition ${
                  listening
                    ? "bg-red-600 text-white border-red-600 animate-pulse"
                    : "bg-white text-amber-600 border-stone-300 hover:border-amber-400 hover:text-amber-700"
                }`}
              >
                {listening ? <MicOff size={19} /> : <Mic size={19} />}
              </button>
            )}
          </div>
          {dictationError && (
            <p className="text-sm font-semibold text-red-600 mb-2">{dictationError}</p>
          )}
          <UppercaseField
            as="textarea"
            value={localCar.notes}
            onChange={(val) => patch({ notes: val })}
            rows={5}
            placeholder="DESCRIBE QUÉ SE HA HECHO AL VEHÍCULO..."
            className="w-full mt-1 px-3 py-3 text-base font-medium text-black uppercase rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500 resize-none"
          />
        </section>

        <div className="flex flex-col gap-2 pb-6">
          {localCar.status !== "terminado" ? (
            <button
              onClick={() => patchNow({ status: "terminado", finishedAt: Date.now() })}
              className="flex-1 flex items-center justify-center gap-2 py-4 rounded-xl bg-green-600 text-white text-lg font-bold uppercase hover:bg-green-700 active:scale-[0.98] transition"
            >
              <Check size={20} /> Marcar como terminado
            </button>
          ) : (
            <>
              <button
                onClick={() => patchNow({ status: "pendiente", finishedAt: null, noted: false })}
                className="w-full flex items-center justify-center gap-2 py-4 rounded-xl bg-stone-200 text-stone-700 text-base font-bold uppercase hover:bg-stone-300 active:scale-[0.98] transition"
              >
                <Clock size={18} /> Reabrir
              </button>
              <button
                onClick={() => patchNow({ noted: !localCar.noted })}
                className={`w-full flex items-center justify-center gap-2 py-3.5 rounded-xl text-sm font-bold uppercase border-2 active:scale-[0.98] transition ${
                  localCar.noted
                    ? "bg-green-50 text-green-700 border-green-500"
                    : "bg-white text-stone-500 border-stone-300 hover:border-stone-400"
                }`}
              >
                <CheckCircle2 size={16} /> {localCar.noted ? "Apuntado ✓" : "Marcar apuntado"}
              </button>
            </>
          )}
        </div>

        {!confirmDelete ? (
          <button
            onClick={() => setConfirmDelete(true)}
            className="text-sm font-bold text-black hover:text-red-500 flex items-center gap-1.5 mx-auto mb-6 py-2 px-3"
          >
            <Trash2 size={16} /> Eliminar vehículo del taller
          </button>
        ) : (
          <div className="text-center mb-6">
            <p className="text-sm font-semibold text-black mb-2">
              ¿Eliminar definitivamente esta ficha?
            </p>
            <div className="flex justify-center gap-2">
              <button
                onClick={() => onDelete(localCar.id)}
                className="text-sm font-bold bg-red-600 text-white px-4 py-2.5 rounded-lg"
              >
                Sí, eliminar
              </button>
              <button
                onClick={() => setConfirmDelete(false)}
                className="text-sm font-bold bg-stone-200 text-stone-700 px-4 py-2.5 rounded-lg"
              >
                Cancelar
              </button>
            </div>
          </div>
        )}
      </div>

      {lightboxIndex !== null && (
        <ImageLightbox
          photos={allOrderPhotos}
          index={lightboxIndex}
          onClose={() => setLightboxIndex(null)}
          onIndexChange={setLightboxIndex}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Tarjeta resumen de vehículo (lista)
--------------------------------------------------------- */
function CarListItem({ car, onOpen, selectionMode, selected, onToggleSelect, onLongPress }) {
  const thumb = car.photos && car.photos[0];
  const entryDate = car.createdAt
    ? new Date(car.createdAt).toLocaleDateString("es-ES", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
      })
    : null;
  const toOrderCount = (car.parts || []).filter((p) => p.status === "pedir").length;
  const toReceiveCount = (car.parts || []).filter((p) => p.status === "pedido").length;

  const longPressTimerRef = useRef(null);
  const longPressTriggeredRef = useRef(false);

  const clearLongPressTimer = () => {
    if (longPressTimerRef.current) {
      clearTimeout(longPressTimerRef.current);
      longPressTimerRef.current = null;
    }
  };

  const startLongPress = () => {
    longPressTriggeredRef.current = false;
    clearLongPressTimer();
    longPressTimerRef.current = setTimeout(() => {
      longPressTriggeredRef.current = true;
      onLongPress && onLongPress(car.id);
    }, 500);
  };

  const handleClick = () => {
    if (longPressTriggeredRef.current) {
      longPressTriggeredRef.current = false;
      return;
    }
    if (selectionMode) {
      onToggleSelect && onToggleSelect(car.id);
    } else {
      onOpen(car.id);
    }
  };

  return (
    <button
      onClick={handleClick}
      onTouchStart={startLongPress}
      onTouchEnd={clearLongPressTimer}
      onTouchMove={clearLongPressTimer}
      onMouseDown={startLongPress}
      onMouseUp={clearLongPressTimer}
      onMouseLeave={clearLongPressTimer}
      className={`relative w-full text-left bg-white rounded-xl overflow-hidden active:scale-[0.99] transition ${
        selected
          ? "border-[5px] border-amber-500"
          : car.noted
          ? "border-[5px] border-green-500"
          : "border border-stone-200 hover:border-stone-300"
      }`}
    >
      {selectionMode && (
        <div
          className={`absolute top-2 left-2 z-[5] w-6 h-6 rounded-full border-2 flex items-center justify-center shadow ${
            selected ? "bg-amber-500 border-amber-500" : "bg-white/90 border-stone-400"
          }`}
        >
          {selected && <Check size={15} className="text-white" />}
        </div>
      )}
      <div className="relative w-full h-48 bg-stone-100">
        {thumb ? (
          <img src={thumb.thumb || thumb.data} alt="" className="w-full h-full object-cover" />
        ) : (
          <div className="w-full h-full flex items-center justify-center text-black">
            <Car size={40} />
          </div>
        )}
        {(toOrderCount > 0 || toReceiveCount > 0) && (
          <div className="absolute top-2 left-2 flex flex-col gap-1 items-start">
            {toOrderCount > 0 && !selectionMode && (
              <span className="text-[11px] font-bold uppercase bg-red-100 text-red-700 border border-red-300 px-2 py-1 rounded-full shadow-sm">
                {toOrderCount} {toOrderCount === 1 ? "pieza" : "piezas"} por pedir
              </span>
            )}
            {toReceiveCount > 0 && !selectionMode && (
              <span className="text-[11px] font-bold uppercase bg-blue-100 text-blue-700 border border-blue-300 px-2 py-1 rounded-full shadow-sm">
                {toReceiveCount} {toReceiveCount === 1 ? "pieza" : "piezas"} por recibir
              </span>
            )}
          </div>
        )}
        {car.noted && (
          <span className="absolute top-2 right-2 text-[11px] font-bold uppercase bg-green-100 text-green-700 border border-green-400 px-2 py-1 rounded-full shadow-sm">
            Apuntado
          </span>
        )}
        {(entryDate || car.mechanic || car.clientName) && (
          <div className="absolute bottom-2 left-2 right-2 flex items-end justify-between gap-1.5">
            {car.mechanic ? (
              <span className="text-[11px] font-bold uppercase bg-black/60 text-white px-2 py-1 rounded-full shadow-sm truncate min-w-0">
                <Wrench size={11} className="inline -mt-0.5 mr-1" />

/* ---------------------------------------------------------
   Pantalla: lista / bandeja
--------------------------------------------------------- */
function CarListScreen({
  cars,
  onOpen,
  onCreate,
  onRefresh,
  dataStale,
  filter,
  setFilter,
  onOpenSidebar,
  onDeleteMultiple,
}) {
  const { pullDistance, refreshing } = usePullToRefresh(onRefresh, true);
  const syncInfo = useSyncState();
  const headerSync = !FIREBASE_CONFIGURED
    ? { text: "Solo este dispositivo", dot: "bg-amber-500" }
    : syncInfo.pending > 0
    ? { text: syncInfo.online ? `${syncInfo.pending} sin subir` : `Sin conexión · ${syncInfo.pending} sin subir`, dot: "bg-amber-500" }
    : !syncInfo.online
    ? { text: "Sin conexión", dot: "bg-amber-500" }
    : { text: "Sincronizado", dot: "bg-green-500" };
  const [isFullscreen, setIsFullscreen] = useState(!!document.fullscreenElement);
  const [manualRefreshing, setManualRefreshing] = useState(false);
  const [selectionMode, setSelectionMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState([]);
  const [confirmBulkDelete, setConfirmBulkDelete] = useState(false);

  useEffect(() => {
    const handleChange = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", handleChange);
    return () => document.removeEventListener("fullscreenchange", handleChange);
  }, []);

  useEffect(() => {
    // Sale del modo selección si se cambia de pestaña
    setSelectionMode(false);
    setSelectedIds([]);
  }, [filter]);

  const toggleFullscreen = async () => {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await document.documentElement.requestFullscreen({ navigationUI: "hide" });
      }
    } catch (err) {
      console.error("No se pudo cambiar el modo pantalla completa:", err);
    }
  };

  const handleManualRefresh = async () => {
    setManualRefreshing(true);
    try {
      await onRefresh();
    } finally {
      setManualRefreshing(false);
    }
  };

  const filtered = cars
    .filter((c) => (filter === "pendiente" ? c.status !== "terminado" : c.status === "terminado"))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  const pendingCount = cars.filter((c) => c.status !== "terminado").length;
  const doneCount = cars.filter((c) => c.status === "terminado").length;

  const indicatorHeight = refreshing ? 44 : pullDistance;

  const startSelection = (id) => {
    setSelectionMode(true);
    setSelectedIds([id]);
  };

  const toggleSelect = (id) => {
    setSelectedIds((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );
  };

  const cancelSelection = () => {
    setSelectionMode(false);
    setSelectedIds([]);
  };

  const confirmDeleteSelected = async () => {
    await onDeleteMultiple(selectedIds);
    setConfirmBulkDelete(false);
    setSelectionMode(false);
    setSelectedIds([]);
  };

  return (
    <div className="min-h-screen bg-stone-100">
      <div
        className="flex items-center justify-center overflow-hidden transition-[height] duration-150 ease-out bg-stone-100"
        style={{ height: indicatorHeight }}
      >
        <RefreshCw
          size={18}
          className={`text-black ${refreshing ? "animate-spin" : ""}`}
          style={!refreshing ? { transform: `rotate(${pullDistance * 3}deg)` } : undefined}
        />
      </div>
      <div className="sticky top-0 z-10 bg-stone-900 text-white px-4 pt-4 pb-3 shadow">
        {selectionMode ? (
          <div className="flex items-center justify-between mb-3">
            <button
              onClick={cancelSelection}
              className="text-sm font-bold uppercase text-white/90 px-2 py-1.5"
            >
              Cancelar
            </button>
            <p className="text-sm font-bold uppercase">
              {selectedIds.length} seleccionado{selectedIds.length === 1 ? "" : "s"}
            </p>
            <button
              onClick={() => setConfirmBulkDelete(true)}
              disabled={selectedIds.length === 0}
              className="flex items-center gap-1.5 text-sm font-bold uppercase text-red-300 px-2 py-1.5 disabled:opacity-40"
            >
              <Trash2 size={16} /> Eliminar
            </button>
          </div>
        ) : (
          <div className="flex items-center justify-between mb-3">
            <button
              onClick={onOpenSidebar}
              aria-label="Historial del taller"
              className="flex items-center gap-2 active:scale-95 transition"
            >
              <div className="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center">
                <Wrench size={16} className="text-stone-900" />
              </div>
              <div className="text-left">
                <p className="font-semibold leading-tight uppercase">Taller</p>
                <p className="text-[11px] text-white/80 leading-tight flex items-center gap-1 uppercase">
                  <span
                    className={`w-1.5 h-1.5 rounded-full inline-block ${headerSync.dot}`}
                  />
                  {headerSync.text}
                </p>
              </div>
            </button>
            <div className="flex items-center gap-3">
              <button
                onClick={handleManualRefresh}
                aria-label={dataStale ? "Hay cambios nuevos, tocar para actualizar" : "Actualizar"}
                className="relative text-white"
              >
                <RefreshCw size={22} className={manualRefreshing ? "animate-spin" : ""} />
                {dataStale && !manualRefreshing && (
                  <span className="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-red-500 border-2 border-stone-900 flex items-center justify-center">
                    <span className="text-[9px] font-black text-white leading-none">!</span>
                  </span>
                )}
              </button>
              <button
                onClick={toggleFullscreen}
                aria-label={isFullscreen ? "Salir de pantalla completa" : "Pantalla completa"}
                className="text-white"
              >
                {isFullscreen ? <Minimize2 size={24} /> : <Maximize2 size={24} />}
              </button>
            </div>
          </div>
        )}

        <div className="flex gap-1.5">
          <button
            onClick={() => setFilter("pendiente")}
            className={`flex-1 min-w-0 flex items-center justify-center gap-1 py-1.5 px-1 rounded-lg text-[11px] leading-tight font-bold uppercase whitespace-nowrap transition ${
              filter === "pendiente" ? "bg-amber-500 text-stone-900" : "bg-stone-800 text-white"
            }`}
          >
            <Clock size={12} className="shrink-0" /> Pend. ({pendingCount})
          </button>
          <button
            onClick={() => setFilter("terminado")}
            className={`flex-1 min-w-0 flex items-center justify-center gap-1 py-1.5 px-1 rounded-lg text-[11px] leading-tight font-bold uppercase whitespace-nowrap transition ${
              filter === "terminado" ? "bg-green-500 text-stone-900" : "bg-stone-800 text-white"
            }`}
          >
            <CheckCircle2 size={12} className="shrink-0" /> Term. ({doneCount})
          </button>
        </div>
      </div>

      <div className="p-4 max-w-lg mx-auto">
        <>
            {filter !== "terminado" && (
              <button
                onClick={onCreate}
                className="w-full flex items-center justify-center gap-2 py-3 mb-4 rounded-xl border-2 border-dashed border-stone-300 text-black font-bold uppercase hover:border-amber-400 hover:text-amber-600 transition"
              >
                <Plus size={18} /> Registrar nuevo vehículo
              </button>
            )}

            {filter === "terminado" && filtered.length > 0 && !selectionMode && (
              <p className="text-xs font-medium text-stone-500 uppercase text-center mb-3">
                Mantén pulsada una ficha para seleccionar varias
              </p>
            )}

            {filtered.length === 0 ? (
              <div className="text-center py-12">
                <AlertCircle size={28} className="mx-auto text-black mb-2" />
                <p className="text-sm font-medium text-black uppercase">
                  {filter === "pendiente"
                    ? "No hay vehículos pendientes."
                    : "Todavía no hay vehículos terminados."}
                </p>
              </div>
            ) : (
              <div className="space-y-2.5">
                {filtered.map((car) => (
                  <CarListItem
                    key={car.id}
                    car={car}
                    onOpen={onOpen}
                    selectionMode={filter === "terminado" && selectionMode}
                    selected={selectedIds.includes(car.id)}
                    onToggleSelect={toggleSelect}
                    onLongPress={filter === "terminado" ? startSelection : undefined}
                  />
                ))}
              </div>
            )}
        </>
      </div>

      <ConfirmDialog
        open={confirmBulkDelete}
        message={`¿Eliminar ${selectedIds.length} ficha${selectedIds.length === 1 ? "" : "s"} definitivamente?`}
        onConfirm={confirmDeleteSelected}
        onCancel={() => setConfirmBulkDelete(false)}
      />
    </div>
  );
}

  const formatPartsList = (parts) => {
    const named = parts.filter((p) => p.name && p.name.trim());
    const unnamedCount = parts.length - named.length;
    const items = named.map((p, i) => (
      <React.Fragment key={p.id || i}>
        {i > 0 && ", "}
        <span className="font-bold">{p.name.trim()}</span>
        {p.supplier && p.supplier.trim() && ` (${p.supplier.trim()})`}
      </React.Fragment>
    ));
    if (unnamedCount > 0) {
      items.push(
        <React.Fragment key="unnamed">
          {named.length > 0 && ", "}
          <span className="font-bold">
            {unnamedCount === 1 ? "1 PIEZA" : `${unnamedCount} PIEZAS`}

        </React.Fragment>

  };

  const pendingParts = cars
    .map((c) => {

      return {

        orderCode: c.orderCode || "SIN CÓDIGO",

        toReceive: parts.filter((p) => p.status === "pedido"),

    .filter((c) => c.toOrder.length > 0 || c.toReceive.length > 0);

    new Date(ts).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });

  const formatDate = (ts) =>
    new Date(ts).toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });

  return (
    <>
      {open && (
        <div
          className="fixed inset-0 bg-black/50 z-40"
          onClick={onClose}
          aria-hidden="true"
        />

      <div
        className={`fixed top-0 right-0 h-full w-[85vw] max-w-sm bg-stone-100 z-50 shadow-2xl transition-transform duration-200 ease-out flex flex-col ${
          open ? "translate-x-0" : "translate-x-full"
        }`}
      >
        <div className="bg-stone-900 text-white px-4 py-3.5 flex items-center justify-between shadow">
          <p className="font-semibold uppercase">Historial del taller</p>
          <button onClick={onClose} aria-label="Cerrar">
            <X size={22} />

        <div className="flex-1 overflow-y-auto p-4 space-y-5">
          <section>
            <h3 className="text-sm font-bold text-black uppercase tracking-wide mb-2 flex items-center gap-1.5">
              <CheckCircle2 size={15} /> Trabajos completados
            </h3>
            {completed.length === 0 ? (
              <p className="text-sm text-black py-2">Todavía no hay trabajos completados.</p>
            ) : (
              <div className="space-y-2">

                    className="w-full text-left bg-white rounded-lg border-2 border-stone-200 px-3 py-2.5 hover:border-amber-400 active:scale-[0.99] transition"
                  >
                    <p className="text-sm font-medium text-black uppercase leading-snug">
                      {(c.mechanic || "SIN ASIGNAR")} completó un{" "}
                      <span className="font-bold">{c.orderCode || "SIN CÓDIGO"}</span> el{" "}
                      {formatDate(c.finishedAt)} a las{" "}
                      {formatTime(c.finishedAt)}

          </section>

          <section>
            <h3 className="text-sm font-bold text-black uppercase tracking-wide mb-2 flex items-center gap-1.5">

            {pendingParts.length === 0 ? (

              <div className="space-y-2">

                  : "Todo subido"}

              {sync.lastSyncAt > 0 && (
                <p className="text-stone-600">

                <p className="text-red-600 font-bold">
                  Este navegador no permite guardar datos en el móvil: sin cobertura, las fotos se pueden perder si se cierra la app.
                </p>

                <button

                >

                    onClick={onUpgradeThumbs}
                    disabled={!!thumbUpgrade}

                  >

                  >

                )}
              </div>
            </div>
          </section>
        </div>
      </div>
    </>
  );
}

/* ---------------------------------------------------------
   Acceso con contraseña (comprobación por hash, sin guardar
   la contraseña en texto plano en el código)
--------------------------------------------------------- */
// Hash SHA-256 de la contraseña de acceso. No es la contraseña en sí:
// es una huella digital de un solo sentido, no se puede "deshacer"
// para recuperar la contraseña original.
const ACCESS_PASSWORD_HASH =
  "ded5bd5485b9b5aa52f61b1a1fcf884e1b9e983f36f632239d5cb94cff54e671";

async function sha256Hex(text) {
  const encoded = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", encoded);
  return Array.from(new Uint8Array(digest))
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
}

function LoginGate({ children }) {
  const [unlocked, setUnlocked] = useState(false);
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [checking, setChecking] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setChecking(true);
    setError(null);
    const hash = await sha256Hex(password);
    if (hash === ACCESS_PASSWORD_HASH) {
      setUnlocked(true);
    } else {
      setError("Contraseña incorrecta.");
    }
    setChecking(false);
  };

  if (unlocked) return children;

  return (
    <div className="min-h-screen flex items-center justify-center bg-stone-100 p-4">
      <form
        onSubmit={handleSubmit}
        className="bg-white rounded-xl shadow-lg p-6 w-full max-w-xs"
      >
        <div className="flex flex-col items-center mb-4">
          <Wrench size={28} className="text-amber-600 mb-2" />
          <h1 className="text-lg font-bold text-black">Acceso al taller</h1>
        </div>
        <input
          type="password"
          autoFocus
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          placeholder="Contraseña"
          className="w-full px-3 py-3 text-base font-medium text-black rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500 mb-3"
        />
        {error && <p className="text-sm font-semibold text-red-600 mb-3">{error}</p>}
        <button
          type="submit"
          disabled={checking || !password}
          className="w-full py-3 rounded-lg bg-amber-600 text-white font-bold uppercase disabled:opacity-50"
        >
          {checking ? "Comprobando..." : "Entrar"}
        </button>
      </form>
    </div>
  );
}

/* ---------------------------------------------------------
   App principal
--------------------------------------------------------- */
function App() {
  const sync = useSyncState();
  const [cars, setCars] = useState(() => LocalFirst.getCars());
  const [openId, setOpenId] = useState(null);
  const [filter, setFilter] = useState("pendiente");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [migration, setMigration] = useState(null);
  const [thumbUpgrade, setThumbUpgrade] = useState(null);
  const [showSynced, setShowSynced] = useState(false);
  const openIdRef = useRef(openId);
  const prevPendingRef = useRef(0);

  useEffect(() => {
    openIdRef.current = openId;
  }, [openId]);

  // La lista de coches viene del motor local: aparece al instante con lo
  // guardado en el móvil y se va actualizando sola cuando termina de
  // sincronizar en segundo plano.
  useEffect(() => {
    const off = LocalFirst.onCars(setCars);
    LocalFirst.boot({ pollMarker: FIREBASE_CONFIGURED }).then(() => setCars(LocalFirst.getCars()));
    return off;
  }, []);

  // Aviso verde "Sincronizado" cuando se vacía la cola de pendientes.
  useEffect(() => {
    const was = prevPendingRef.current;
    prevPendingRef.current = sync.pending;
    if (was > 0 && sync.pending === 0) {
      setShowSynced(true);
      const t = setTimeout(() => setShowSynced(false), 1600);
      return () => clearTimeout(t);
    }
  }, [sync.pending]);

  // Gestión del botón "atrás" del navegador/móvil:
  // - Si hay un vehículo abierto, "atrás" vuelve a la lista principal.
  // - Si estamos en la lista principal, "atrás" sale de la app normalmente.
  useEffect(() => {
    const handlePopState = () => {
      if (openIdRef.current) {
        // Estábamos en el detalle: volvemos a la lista y reponemos el estado base.
        setOpenId(null);
        window.history.pushState({ screen: "list" }, "");
      }
    };

    window.addEventListener("popstate", handlePopState);
    return () => window.removeEventListener("popstate", handlePopState);
  }, []);

  const openCarDetail = (id) => {
    window.history.pushState({ screen: "detail" }, "");
    setOpenId(id);
  };

  const closeCarDetail = () => {
    window.history.back();
  };

  // Pull-to-refresh / botón de actualizar: descarga solo lo que ha cambiado.
  const handleRefresh = useCallback(() => LocalFirst.syncNow().catch(() => {}), []);
  const handleSyncFull = useCallback(() => LocalFirst.syncNow({ full: true }).catch(() => {}), []);

  const handleCreate = () => {
    // Se crea al instante en el móvil, sin esperar a Firebase. El código de
    // orden (OT-xxxx) se asigna en cuanto hay conexión.
    const newCar = {
      id: uid(),
      orderCode: "",
      brand: "",
      model: "",
      plate: "",
      km: "",
      clientName: "",
      clientPhone: "",
      parts: [],
      photos: [],
      clientPhotos: [],
      laborHours: "",
      mechanic: "",
      notes: "",
      status: "pendiente",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      finishedAt: null,
      noted: false,
    };
    setCars((prev) => [...prev.filter((c) => c.id !== newCar.id), newCar]);
    openCarDetail(newCar.id);
    LocalFirst.createCarLocal(newCar).catch((err) => console.error("Error creando la orden:", err));
  };

  const handleUpdateCar = (updatedCar) => {
    setCars((prev) => prev.map((c) => (c.id === updatedCar.id ? updatedCar : c)));
    return LocalFirst.saveCarLocal(updatedCar).catch((err) => console.error("Error guardando en el móvil:", err));
  };

  const handleDeleteCar = (id) => {
    setCars((prev) => prev.filter((c) => c.id !== id));
    setOpenId(null);
    LocalFirst.deleteCarLocal(id).catch((err) => console.error("Error borrando:", err));
  };

  const handleDeleteMultiple = (ids) => {
    const idSet = new Set(ids);
    setCars((prev) => prev.filter((c) => !idSet.has(c.id)));
    if (openId && idSet.has(openId)) setOpenId(null);
    ids.forEach((id) => LocalFirst.deleteCarLocal(id).catch((err) => console.error("Error borrando:", err)));
  };

  const handleMigrate = async () => {
    const n = LocalFirst.countLegacyPhotos(cars);
    const ok = window.confirm(
      `Se van a optimizar ${n} fotos antiguas: cada foto se guardará por separado en Firebase y la lista cargará mucho más rápido.\n\n` +
        "Hazlo con buena conexión (wifi) y cuando nadie más esté editando coches. Puede tardar unos minutos.\n\n¿Continuar?"
    );
    if (!ok) return;
    setMigration({ done: 0, total: 0 });
    try {
      await LocalFirst.migrateLegacy((done, total) => setMigration({ done, total }));
    } catch (err) {
      window.alert("No se pudo completar la optimización: " + ((err && err.message) || err));
    } finally {
      setMigration(null);
    }
  };

  const handleUpgradeThumbs = async () => {
    const n = LocalFirst.countOldThumbs(cars);
    const ok = window.confirm(
      `Se va a mejorar la calidad de ${n} vistas previas ya subidas. Se regeneran a partir de la foto completa (no se pierde nada y no hace falta volver a subir las fotos).\n\n` +
        "Hazlo con buena conexión (wifi) y cuando nadie más esté editando coches. Puede tardar unos minutos.\n\n¿Continuar?"
    );
    if (!ok) return;
    setThumbUpgrade({ done: 0, total: 0 });
    try {
      const r = await LocalFirst.upgradeThumbs((done, total) => setThumbUpgrade({ done, total }));
      let msg = `Listo: ${r.upgraded} vistas previas mejoradas.`;
      if (r.skipped > 0) msg += `\n${r.skipped} se han dejado como estaban porque esas órdenes tienen muchas fotos y no caben con mayor calidad.`;
      if (r.failed > 0) msg += `\n${r.failed} no se pudieron procesar (foto no disponible); vuelve a intentarlo con mejor conexión.`;
      window.alert(msg);
    } catch (err) {
      window.alert("No se pudo completar la mejora: " + ((err && err.message) || err));
    } finally {
      setThumbUpgrade(null);
    }
  };

  const retryAll = () => {
    LocalFirst.retryNow();
    LocalFirst.syncNow().catch(() => {});
  };

  /* ---- pantallas de carga inicial (solo la primera vez en este móvil) ---- */
  const firstLoad = sync.ready && !sync.hasSynced && cars.length === 0;
  if (!sync.ready || (firstLoad && !sync.lastError)) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-100">
        <p className="text-black text-sm font-medium uppercase">
          {sync.progress ? `Cargando taller... ${sync.progress.done}/${sync.progress.total}` : "Cargando taller..."}
        </p>
      </div>
    );
  }

  if (firstLoad && sync.lastError) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-100 px-6">
        <div className="max-w-sm w-full bg-white border border-red-200 rounded-xl p-5 text-center">
          <AlertCircle className="mx-auto text-red-500 mb-2" size={28} />
          <p className="text-stone-700 font-medium mb-1">No se pudieron cargar los datos</p>
          <p className="text-sm text-black break-words mb-4">{sync.lastError}</p>
          <button
            onClick={() => LocalFirst.syncNow({ full: true }).catch(() => {})}
            className="w-full bg-amber-500 text-white text-sm font-medium py-2 rounded-lg hover:bg-amber-600 transition"
          >
            Reintentar
          </button>
        </div>
      </div>
    );
  }

  /* ---- aviso de estado de la sincronización ---- */
  let pill = null;
  const plural = (n) => `${n} ${n === 1 ? "cambio" : "cambios"}`;
  if (sync.pending > 0) {
    const warn = sync.degraded ? " · ⚠ sin copia segura en el móvil" : "";
    if (sync.permFailed > 0) {
      pill = { tone: "error", text: `No se pudo subir: ${sync.permError} · Toca para reintentar` };
    } else if (!sync.online) {
      pill = { tone: "warn", text: `Sin conexión · ${plural(sync.pending)} guardado(s) en este móvil${warn}` };
    } else if (sync.pushing) {
      pill = { tone: "info", text: `Subiendo… (${sync.pending})${warn}` };
    } else {
      pill = { tone: "warn", text: `Guardado en este móvil · ${plural(sync.pending)} sin subir · toca para reintentar${warn}` };
    }
  } else if (showSynced) {
    pill = { tone: "ok", text: "Sincronizado" };
  }

  const openCar = cars.find((c) => c.id === openId);

  return (
    <div className="relative">
      {openCar ? (
        <CarDetail
          car={openCar}
          onBack={closeCarDetail}
          onUpdate={handleUpdateCar}
          onDelete={handleDeleteCar}
        />
      ) : (
        <CarListScreen
          cars={cars}
          onOpen={openCarDetail}
          onCreate={handleCreate}
          onRefresh={handleRefresh}
          dataStale={sync.stale}
          filter={filter}
          setFilter={setFilter}
          onOpenSidebar={() => setSidebarOpen(true)}
          onDeleteMultiple={handleDeleteMultiple}
        />
      )}

      <WorkshopSidebar
        open={sidebarOpen}
        onClose={() => setSidebarOpen(false)}
        cars={cars}
        onOpenCar={(id) => {
          setSidebarOpen(false);
          openCarDetail(id);
        }}
        sync={sync}
        legacyCount={LocalFirst.countLegacyPhotos(cars)}
        migration={migration}
        onSyncFull={handleSyncFull}
        onMigrate={handleMigrate}
        oldThumbCount={LocalFirst.countOldThumbs(cars)}
        thumbUpgrade={thumbUpgrade}
        onUpgradeThumbs={handleUpgradeThumbs}
      />

      {pill && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 max-w-[92vw]">
          <div
            onClick={() => {
              if (pill.tone !== "ok") retryAll();
            }}
            className={`text-xs font-medium px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 ${
              pill.tone === "info"
                ? "bg-stone-800 text-white"
                : pill.tone === "warn"
                ? "bg-amber-600 text-white cursor-pointer"
                : pill.tone === "error"
                ? "bg-red-600 text-white cursor-pointer"
                : "bg-green-600 text-white"
            }`}
          >
            {pill.tone === "ok" && <Check size={12} />}
            {pill.tone === "error" && <AlertCircle size={12} className="flex-shrink-0" />}
            <span className="truncate">{pill.text}</span>
          </div>
        </div>
      )}
    </div>
  );
}

// El motor arranca YA (lee lo guardado en el móvil y empieza a sincronizar)
// mientras el mecánico escribe la contraseña, en vez de esperar a después.
LocalFirst.boot({ pollMarker: FIREBASE_CONFIGURED });

const root = createRoot(document.getElementById("root"));
root.render(
  <LoginGate>
    <App />
  </LoginGate>
);
</script>
</body>
</html>
