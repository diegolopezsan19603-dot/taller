/* ---------------------------------------------------------
   Almacenamiento: localStorage (solo este dispositivo)
--------------------------------------------------------- */
const LS_PREFIX = "workshop-app:";

const localStorageAPI = {
  async get(key) {
    const raw = window.localStorage.getItem(LS_PREFIX + key);
    if (raw === null) return null;
    return { key, value: raw };
  },
  async set(key, value) {
    window.localStorage.setItem(LS_PREFIX + key, value);
    return { key, value };
  },
  async delete(key) {
    window.localStorage.removeItem(LS_PREFIX + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX)) {
        const short = k.slice(LS_PREFIX.length);
        if (!prefix || short.startsWith(prefix)) keys.push(short);
      }
    }
    return { keys };
  }
};

/* ---------------------------------------------------------
   Almacenamiento: Firestore (compartido entre dispositivos)
   Usa autenticación anónima: cada dispositivo entra sin
   pedir usuario/contraseña, pero queda autenticado, para que
   las reglas de Firestore puedan exigir "if request.auth != null".
--------------------------------------------------------- */
const FS_COLLECTION = "workshop_data";
let firestoreAPI = null;

if (FIREBASE_CONFIGURED) {
  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  // inMemoryPersistence evita depender de IndexedDB, que en algunos
  // navegadores móviles se bloquea o cuelga silenciosamente. Como el
  // login es anónimo y las reglas solo exigen "estar autenticado",
  // no pasa nada por re-autenticar en cada carga de página.
  const auth = initializeAuth(firebaseApp, { persistence: inMemoryPersistence });

  const authReady = new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      const online = typeof navigator !== "undefined" ? navigator.onLine : "desconocido";
      reject(new Error(
        `Tiempo de espera agotado iniciando sesión en Firebase (conexión: ${online}). Revisa la red o que el inicio de sesión anónimo esté activado en Firebase.`
      ));
    }, 15000);
    onAuthStateChanged(auth, (user) => {
      if (user) {
        clearTimeout(timeout);
        resolve(user);
      }
    });
    signInAnonymously(auth).catch((err) => {
      clearTimeout(timeout);
      reject(err);
    });
  });

  firestoreAPI = {
    async get(key) {
      await authReady;
      const snap = await getDoc(doc(db, FS_COLLECTION, key));
      if (!snap.exists()) return null;
      return { key, value: snap.data().value };
    },
    async set(key, value) {
      await authReady;
      await setDoc(doc(db, FS_COLLECTION, key), { value, updatedAt: Date.now() });
      return { key, value };
    },
    async delete(key) {
      await authReady;
      await deleteDoc(doc(db, FS_COLLECTION, key));
      return { key, deleted: true };
    },
    async list(prefix) {
      await authReady;
      const snap = await getDocs(collection(db, FS_COLLECTION));
      const keys = [];
      snap.forEach((d) => {
        if (!prefix || d.id.startsWith(prefix)) keys.push(d.id);
      });
      return { keys };
    }
  };
}

window.storage = firestoreAPI || localStorageAPI;

/* ---------------------------------------------------------
   Compresión de imágenes a base64
--------------------------------------------------------- */
function fileToCompressedDataUrl(file, maxDim = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new window.Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------
   Componente: subida de foto
--------------------------------------------------------- */
function PhotoPicker({ onPick, label = "Añadir foto", small }) {
  const cameraRef = useRef(null);
  const galleryRef = useRef(null);
  const btnRef = useRef(null);
  const [loading, setLoading] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [menuPos, setMenuPos] = useState({ top: 0, left: 0 });

  const handleChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setLoading(true);
    try {
      const dataUrl = await fileToCompressedDataUrl(file);
      onPick(dataUrl);
    } finally {
      setLoading(false);
      e.target.value = "";
    }
  };

  const MENU_WIDTH = 160; // w-40

  const openMenu = () => {
    const rect = btnRef.current?.getBoundingClientRect();
    if (rect) {
      let left = rect.left;
      // Evita que el menú se salga por la derecha de la pantalla
      if (left + MENU_WIDTH > window.innerWidth - 8) {
        left = Math.max(8, window.innerWidth - MENU_WIDTH - 8);
      }
      let top = rect.bottom + 4;
      const MENU_HEIGHT = 88; // altura aproximada del menú (2 opciones)
      // Si no cabe debajo, lo abre hacia arriba
      if (top + MENU_HEIGHT > window.innerHeight - 8) {
        top = Math.max(8, rect.top - MENU_HEIGHT - 4);
      }
      setMenuPos({ top, left });
    }
    setMenuOpen(true);
  };

  const btnClass = `inline-flex items-center gap-1.5 rounded-md border border-stone-300 bg-white font-medium text-stone-700 hover:bg-stone-50 active:scale-[0.98] transition ${
    small ? "px-2.5 py-1.5 text-xs" : "px-3 py-2 text-sm"
  }`;

  return (
    <div className="inline-block">
      <input
        ref={cameraRef}
        type="file"
        accept="image/*"
        capture="environment"
        onChange={handleChange}
        style={{ display: "none" }}
      />
      <input
        ref={galleryRef}
        type="file"
        accept="image/*"
        onChange={handleChange}
        style={{ display: "none" }}
      />
      <button
        ref={btnRef}
        type="button"
        onClick={() => (menuOpen ? setMenuOpen(false) : openMenu())}
        disabled={loading}
        className={btnClass}
      >
        <Camera size={small ? 22 : 18} />
        {loading ? "Cargando..." : label}
      </button>

      {menuOpen && !loading && createPortal(
        <>
          <div className="fixed inset-0 z-40" onClick={() => setMenuOpen(false)} />
          <div
            className="fixed z-50 bg-white rounded-lg border border-stone-200 shadow-lg overflow-hidden w-48"
            style={{ top: menuPos.top, left: menuPos.left }}
          >
            <button
              type="button"
              onClick={() => {
                setMenuOpen(false);
                cameraRef.current?.click();
              }}
              className="w-full flex items-center gap-2.5 px-3.5 py-3.5 text-sm font-medium text-stone-700 hover:bg-stone-50 text-left"
            >
              <Camera size={20} /> Hacer foto
            </button>
            <button
              type="button"
              onClick={() => {
                setMenuOpen(false);
                galleryRef.current?.click();
              }}
              className="w-full flex items-center gap-2.5 px-3.5 py-3.5 text-sm font-medium text-stone-700 hover:bg-stone-50 text-left border-t border-stone-100"
            >
              <Package size={20} /> Elegir de galería
            </button>
          </div>
        </>,
        document.body
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Componente: visor de foto ampliada (lightbox simple)
--------------------------------------------------------- */
function ImageLightbox({ src, onClose }) {
  const [scale, setScale] = useState(1);
  const [translate, setTranslate] = useState({ x: 0, y: 0 });
  const pinchRef = useRef({ active: false, startDist: 0, startScale: 1 });
  const panRef = useRef({ active: false, startX: 0, startY: 0, startTranslate: { x: 0, y: 0 } });
  const lastTapRef = useRef(0);

  useEffect(() => {
    setScale(1);
    setTranslate({ x: 0, y: 0 });
  }, [src]);

  if (!src) return null;

  const getDistance = (touches) => {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  };

  const clampScale = (s) => Math.min(Math.max(s, 1), 5);

  const handleTouchStart = (e) => {
    if (e.touches.length === 2) {
      pinchRef.current = {
        active: true,
        startDist: getDistance(e.touches),
        startScale: scale,
      };
    } else if (e.touches.length === 1) {
      if (scale > 1) {
        panRef.current = {
          active: true,
          startX: e.touches[0].clientX,
          startY: e.touches[0].clientY,
          startTranslate: { ...translate },
        };
      } else {
        const now = Date.now();
        if (now - lastTapRef.current < 300) {
          setScale(2.5);
        }
        lastTapRef.current = now;
      }
    }
  };

  const handleTouchMove = (e) => {
    if (e.touches.length === 2 && pinchRef.current.active) {
      e.preventDefault();
      const dist = getDistance(e.touches);
      const ratio = dist / (pinchRef.current.startDist || dist);
      setScale(clampScale(pinchRef.current.startScale * ratio));
    } else if (e.touches.length === 1 && panRef.current.active && scale > 1) {
      e.preventDefault();
      const dx = e.touches[0].clientX - panRef.current.startX;
      const dy = e.touches[0].clientY - panRef.current.startY;
      setTranslate({
        x: panRef.current.startTranslate.x + dx,
        y: panRef.current.startTranslate.y + dy,
      });
    }
  };

  const handleTouchEnd = (e) => {
    if (e.touches.length < 2) pinchRef.current.active = false;
    if (e.touches.length < 1) panRef.current.active = false;
    if (e.touches.length === 0 && scale < 1.02) {
      setScale(1);
      setTranslate({ x: 0, y: 0 });
    }
  };

  const handleShare = async (e) => {
    e.stopPropagation();
    try {
      const res = await fetch(src);
      const blob = await res.blob();
      const file = new File([blob], "foto.jpg", { type: blob.type || "image/jpeg" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else {
        // Alternativa si el navegador no admite compartir archivos:
        // se descarga la imagen para que el usuario la comparta manualmente.
        const link = document.createElement("a");
        link.href = src;
        link.download = "foto.jpg";
        link.click();
      }
    } catch (err) {
      if (err && err.name !== "AbortError") {
        console.error("No se pudo compartir la imagen:", err);
      }
    }
  };

  return createPortal(
    <div
      className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 overflow-hidden touch-none"
      onClick={onClose}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      <img
        src={src}
        alt=""
        onClick={(e) => e.stopPropagation()}
        draggable={false}
        style={{
          transform: `translate(${translate.x}px, ${translate.y}px) scale(${scale})`,
          transition: pinchRef.current.active || panRef.current.active ? "none" : "transform 0.15s ease-out",
        }}
        className="max-w-full max-h-full rounded-lg select-none touch-none"
      />
      <button
        className="absolute top-4 left-4 text-white bg-white/10 rounded-full p-2"
        onClick={handleShare}
        aria-label="Compartir imagen"
      >
        <Share2 size={20} />
      </button>
      <button
        className="absolute top-4 right-4 text-white bg-white/10 rounded-full p-2"
        onClick={onClose}
      >
        <X size={20} />
      </button>
    </div>,
    document.body
  );
}

/* ---------------------------------------------------------
   Hook: pull-to-refresh (arrastrar hacia abajo para recargar)
   Detecta un gesto táctil de arrastre hacia abajo cuando la
   página está en la parte superior, y llama a onRefresh().
--------------------------------------------------------- */
function usePullToRefresh(onRefresh, enabled = true) {
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startYRef = useRef(null);
  const refreshingRef = useRef(false);

  useEffect(() => {
    if (!enabled) return;

    const handleTouchStart = (e) => {
      if (refreshingRef.current) return;
      startYRef.current = window.scrollY <= 0 ? e.touches[0].clientY : null;
    };
    const handleTouchMove = (e) => {
      if (startYRef.current === null || refreshingRef.current) return;
      const distance = e.touches[0].clientY - startYRef.current;
      if (distance > 0 && window.scrollY <= 0) {
        setPullDistance(Math.min(distance * 0.5, 80));
      } else {
        setPullDistance(0);
      }
    };
    const handleTouchEnd = () => {
      if (startYRef.current === null) return;
      startYRef.current = null;
      setPullDistance((current) => {
        if (current > 50 && !refreshingRef.current) {
          refreshingRef.current = true;
          setRefreshing(true);
          Promise.resolve(onRefresh()).finally(() => {
            refreshingRef.current = false;
            setRefreshing(false);
          });
        }
        return 0;
      });
    };

    document.addEventListener("touchstart", handleTouchStart, { passive: true });
    document.addEventListener("touchmove", handleTouchMove, { passive: true });
    document.addEventListener("touchend", handleTouchEnd, { passive: true });
    return () => {
      document.removeEventListener("touchstart", handleTouchStart);
      document.removeEventListener("touchmove", handleTouchMove);
      document.removeEventListener("touchend", handleTouchEnd);
    };
  }, [enabled, onRefresh]);

  return { pullDistance, refreshing };
}

const SUPPLIER_OPTIONS = ["Indalo", "A.R.Vera", "Ad Salas"];

function PartCard({ part, onUpdate, onDelete }) {
  const isCustomSupplier = !!part.supplier && !SUPPLIER_OPTIONS.includes(part.supplier);
  const [showCustomSupplier, setShowCustomSupplier] = useState(isCustomSupplier);
  const [customSupplier, setCustomSupplier] = useState(isCustomSupplier ? part.supplier : "");
  const [viewerOpen, setViewerOpen] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [listeningName, setListeningName] = useState(false);
  const nameRecognitionRef = useRef(null);
  const partRef = useRef(part);
  useEffect(() => {
    partRef.current = part;
  }, [part]);
  const speechSupportedName =
    typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const state = PART_STATES[part.status];

  const toggleNameDictation = () => {
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionImpl) return;

    if (listeningName) {
      nameRecognitionRef.current && nameRecognitionRef.current.stop();
      return;
    }

    const recognition = new SpeechRecognitionImpl();
    recognition.lang = "es-ES";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      let finalText = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      }
      if (finalText.trim()) {
        const addition = finalText.trim().toUpperCase();
        const prevName = partRef.current.name || "";
        onUpdate({ ...partRef.current, name: prevName ? prevName + " " + addition : addition });
      }
    };
    recognition.onerror = () => setListeningName(false);
    recognition.onend = () => setListeningName(false);

    try {
      nameRecognitionRef.current = recognition;
      recognition.start();
      setListeningName(true);
    } catch (err) {
      setListeningName(false);
    }
  };

  useEffect(() => {
    return () => {
      nameRecognitionRef.current && nameRecognitionRef.current.stop();
    };
  }, []);

  const nameTextareaRef = useRef(null);
  useEffect(() => {
    if (nameTextareaRef.current) {
      nameTextareaRef.current.style.height = "auto";
      nameTextareaRef.current.style.height = nameTextareaRef.current.scrollHeight + "px";
    }
  }, [part.name]);

  return (
    <div className="bg-white rounded-lg border-2 border-stone-200 overflow-hidden">
      <div className="p-3.5">
        <div className="flex items-start gap-2 mb-2.5">
          <textarea
            ref={nameTextareaRef}
            value={part.name}
            onChange={(e) => onUpdate({ ...part, name: e.target.value.toUpperCase() })}
            placeholder="NOMBRE DE LA PIEZA"
            rows={1}
            onInput={(e) => {
              e.target.style.height = "auto";
              e.target.style.height = e.target.scrollHeight + "px";
            }}
            className="flex-1 min-w-0 text-base font-bold text-black uppercase border-none outline-none bg-transparent placeholder-stone-400 resize-none overflow-hidden break-words"
          />
          {speechSupportedName && (
            <button
              type="button"
              onClick={toggleNameDictation}
              aria-label={listeningName ? "Detener dictado" : "Dictar nombre de la pieza"}
              className={`flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-lg border-2 transition ${
                listeningName
                  ? "bg-red-600 text-white border-red-600 animate-pulse"
                  : "bg-white text-amber-600 border-stone-300 hover:border-amber-400 hover:text-amber-700"
              }`}
            >
              {listeningName ? <MicOff size={19} /> : <Mic size={19} />}
            </button>
          )}
          <button
            onClick={() => setConfirmDelete(true)}
            aria-label="Eliminar pieza"
            className="text-black hover:text-red-500 flex-shrink-0 p-1.5"
          >
            <Trash2 size={20} />
          </button>
        </div>

        <div className="flex items-start gap-3">
          <div className="flex-shrink-0">
            {part.photo ? (
              <div className="relative">
                <img
                  src={part.photo.data}
                  alt=""
                  onClick={() => setViewerOpen(true)}
                  className="w-24 h-24 object-cover rounded-md border border-stone-300 cursor-pointer"
                />
                <button
                  onClick={() => onUpdate({ ...part, photo: null })}
                  aria-label="Eliminar foto de la pieza"
                  className="absolute -top-2 -right-2 w-7 h-7 rounded-full bg-red-600 text-white flex items-center justify-center shadow"
                >
                  <X size={14} />
                </button>
                {viewerOpen && (
                  <ImageLightbox src={part.photo.data} onClose={() => setViewerOpen(false)} />
                )}
              </div>
            ) : (
              <div className="w-24 h-24 flex items-center justify-center">
                <PhotoPicker
                  small
                  label=""
                  onPick={(data) => onUpdate({ ...part, photo: { id: uid(), data } })}
                />
              </div>
            )}
          </div>

          <div className="flex-1 min-w-0">
            <div className="grid grid-cols-2 gap-2">
              {Object.entries(PART_STATES).map(([key, s]) => (
                <button
                  key={key}
                  onClick={() => onUpdate({ ...part, status: key })}
                  className={`w-full text-sm px-2 py-2 rounded-lg border-2 font-bold uppercase text-center leading-tight transition ${
                    part.status === key ? s.color : "bg-stone-50 text-black border-stone-200"
                  }`}
                >
                  {s.shortLabel}
                </button>
              ))}
            </div>

            {(part.status === "pedido" || part.status === "recibido") && (
              <div className="mt-2.5 space-y-1.5">
                <select
                  value={showCustomSupplier ? "Otro" : (part.supplier || "")}
                  onChange={(e) => {
                    const val = e.target.value;
                    if (val === "Otro") {
                      setShowCustomSupplier(true);
                      onUpdate({ ...part, supplier: customSupplier });
                    } else {
                      setShowCustomSupplier(false);
                      onUpdate({ ...part, supplier: val });
                    }
                  }}
                  className="w-full text-sm px-2.5 py-2 rounded-md border-2 border-stone-300 outline-none focus:border-amber-500 uppercase text-black font-medium bg-white"
                >
                  <option value="">PEDIDO EN...</option>
                  {SUPPLIER_OPTIONS.map((opt) => (
                    <option key={opt} value={opt}>
                      {opt.toUpperCase()}
                    </option>
                  ))}
                  <option value="Otro">OTRO:</option>
                </select>
                {showCustomSupplier && (
                  <input
                    autoFocus
                    value={customSupplier}
                    onChange={(e) => {
                      const val = e.target.value.toUpperCase();
                      setCustomSupplier(val);
                      onUpdate({ ...part, supplier: val });
                    }}
                    placeholder="ESCRIBE EL PROVEEDOR"
                    className="w-full text-sm px-2.5 py-2 rounded-md border-2 border-stone-300 outline-none focus:border-amber-500 uppercase text-black font-medium"
                  />
                )}
              </div>
            )}
          </div>
        </div>
      </div>
      <ConfirmDialog
        open={confirmDelete}
        message="¿Seguro que quieres eliminarlo?"
        onConfirm={() => {
          onDelete(part.id);
          setConfirmDelete(false);
        }}
        onCancel={() => setConfirmDelete(false)}
      />
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla de detalle de vehículo

function CarDetail({ car, onBack, onUpdate, onDelete }) {
  const [localCar, setLocalCar] = useState(car);
  const carRef = useRef(car);
  const onUpdateRef = useRef(onUpdate);
  const [listening, setListening] = useState(false);
  const [dictationError, setDictationError] = useState(null);
  const recognitionRef = useRef(null);
  const speechSupported =
    typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  useEffect(() => setLocalCar(car), [car.id]);
  useEffect(() => {
    carRef.current = localCar;
  }, [localCar]);
  useEffect(() => {
    onUpdateRef.current = onUpdate;
  }, [onUpdate]);

  const patch = useCallback(
    (fields) => {
      const updated = { ...localCar, ...fields, updatedAt: Date.now() };
      setLocalCar(updated);
      onUpdate(updated);
    },
    [localCar, onUpdate]
  );

  const toggleDictation = () => {
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionImpl) return;

    if (listening) {
      recognitionRef.current && recognitionRef.current.stop();
      return;
    }

    setDictationError(null);

    if (typeof window.isSecureContext !== "undefined" && !window.isSecureContext) {
      setDictationError(
        "El dictado por voz solo funciona con conexión segura (https)."
      );
      return;
    }

    const recognition = new SpeechRecognitionImpl();
    recognition.lang = "es-ES";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      let finalText = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      }
      if (finalText.trim()) {
        const addition = finalText.trim().toUpperCase();
        const prevNotes = carRef.current.notes || "";
        const updated = {
          ...carRef.current,
          notes: prevNotes ? prevNotes + " " + addition : addition,
          updatedAt: Date.now(),
        };
        carRef.current = updated;
        setLocalCar(updated);
        onUpdateRef.current(updated);
      }
    };
    recognition.onerror = (event) => {
      setListening(false);
      const errorMessages = {
        "not-allowed": "Permiso de micrófono denegado. Revisa los permisos del navegador para esta página.",
        "service-not-allowed": "El navegador ha bloqueado el micrófono (puede requerir https).",
        network: "Sin conexión a internet: el dictado por voz necesita red para funcionar.",
        "no-speech": "No se ha detectado voz. Inténtalo de nuevo hablando más cerca del micrófono.",
        "audio-capture": "No se ha encontrado ningún micrófono en este dispositivo.",
        aborted: null,
      };
      const msg = event && event.error ? errorMessages[event.error] : null;
      if (msg !== null) {
        setDictationError(msg || `Error de dictado: ${event ? event.error : "desconocido"}`);
      }
    };
    recognition.onend = () => setListening(false);

    try {
      recognitionRef.current = recognition;
      recognition.start();
      setListening(true);
    } catch (err) {
      setListening(false);
      setDictationError((err && err.message) || "No se pudo iniciar el dictado por voz.");
    }
  };

  useEffect(() => {
    return () => {
      recognitionRef.current && recognitionRef.current.stop();
    };
  }, []);

  const addPart = () => {
    patch({
      parts: [
        ...localCar.parts,
        { id: uid(), name: "", status: "pedir", supplier: "", photo: null },
      ],
    });
  };
  const updatePart = (part) => {
    patch({ parts: localCar.parts.map((p) => (p.id === part.id ? part : p)) });
  };
  const deletePart = (id) => {
    patch({ parts: localCar.parts.filter((p) => p.id !== id) });
  };

  const addPhoto = (data) => {
    patch({ photos: [...localCar.photos, { id: uid(), data }] });
  };
  const deletePhoto = (id) => {
    patch({ photos: localCar.photos.filter((p) => p.id !== id) });
  };

  const addClientPhoto = (data) => {
    patch({ clientPhotos: [...(localCar.clientPhotos || []), { id: uid(), data }] });
  };
  const deleteClientPhoto = (id) => {
    patch({ clientPhotos: (localCar.clientPhotos || []).filter((p) => p.id !== id) });
  };

  const [confirmDelete, setConfirmDelete] = useState(false);

  return (
    <div className="min-h-screen bg-stone-100">
      <div className="sticky top-0 z-10 bg-stone-900 text-white px-4 py-3 flex items-center gap-3 shadow">
        <button onClick={onBack} aria-label="Volver">
          <ChevronLeft size={22} />
        </button>
        <div className="flex-1 min-w-0">
          <p className="font-semibold truncate uppercase">
            {localCar.orderCode || "ORDEN DE REPARACIÓN"}
          </p>
        </div>
        {localCar.status === "terminado" ? (
          <span className="flex items-center gap-1 text-xs font-medium bg-green-500/20 text-green-300 px-2.5 py-1 rounded-full border border-green-500/30 uppercase">
            <CheckCircle2 size={13} /> Terminado
          </span>
        ) : (
          <span className="flex items-center gap-1 text-xs font-medium bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full border border-amber-500/30 uppercase">
            <Clock size={13} /> Pendiente
          </span>
        )}
      </div>

      <div className="p-4 space-y-4 max-w-lg mx-auto">
        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <h2 className="text-sm font-bold text-black uppercase tracking-wide mb-3">
            Mecánico
          </h2>
          <select
            value={localCar.mechanic || ""}
            onChange={(e) => patch({ mechanic: e.target.value })}
            className="w-full px-3 py-3 text-base font-bold text-black uppercase rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500 bg-white"
          >
            <option value="">SIN ASIGNAR</option>
            <option value="Francisco">FRANCISCO</option>
            <option value="Alfonso">ALFONSO</option>
            <option value="Ginés">GINÉS</option>
            <option value="Ramón">RAMÓN</option>
          </select>
        </section>

        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <h2 className="text-sm font-bold text-black uppercase tracking-wide mb-3">
            Vehículo
          </h2>
          <div className="space-y-3">
            <div>
              <label className="text-sm font-semibold text-black flex items-center gap-1">
                <Car size={14} /> Matrícula
              </label>
              <input
                value={localCar.plate}
                onChange={(e) => patch({ plate: e.target.value.toUpperCase() })}
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black uppercase rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            <div>
              <label className="text-sm font-semibold text-black flex items-center gap-1">
                <Gauge size={14} /> Kilómetros
              </label>
              <input
                type="number"
                inputMode="numeric"
                value={localCar.km}
                onChange={(e) => patch({ km: e.target.value })}
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            <div>
              <h3 className="text-sm font-semibold text-black mb-2">Fotos del vehículo</h3>
              <PhotoGallery photos={localCar.photos} onDelete={deletePhoto} onAdd={addPhoto} />
            </div>
          </div>
        </section>

        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <h2 className="text-sm font-bold text-black uppercase tracking-wide mb-3">
            Cliente
          </h2>
          <div className="space-y-3">
            <div>
              <label className="text-sm font-semibold text-black flex items-center gap-1">
                <User size={14} /> Nombre
              </label>
              <input
                value={localCar.clientName}
                onChange={(e) => patch({ clientName: e.target.value.toUpperCase() })}
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black uppercase rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            <div>
              <label className="text-sm font-semibold text-black flex items-center gap-1">
                <Phone size={14} /> Teléfono
              </label>
              <input
                value={localCar.clientPhone}
                onChange={(e) => patch({ clientPhone: e.target.value })}
                className="w-full mt-1 px-3 py-3 text-base font-medium text-black rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500"
              />
            </div>
            <div>
              <h3 className="text-sm font-semibold text-black mb-2">Fotos del cliente</h3>
              <PhotoGallery
                photos={localCar.clientPhotos || []}
                onDelete={deleteClientPhoto}
                onAdd={addClientPhoto}
              />
            </div>
          </div>
        </section>

        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-black uppercase tracking-wide flex items-center gap-1.5">
              <Package size={16} /> Piezas de recambio
            </h2>
            <button

            >
              <Plus size={16} /> Añadir pieza

          {localCar.parts.length === 0 ? (
            <p className="text-base font-medium text-black text-center py-6">

                  onDelete={deletePart}

        <section className="bg-white rounded-xl border-2 border-stone-200 p-5">

            <button

              <Check size={20} /> Marcar como terminado

          ) : (
            <>
              <button
                onClick={() => patch({ status: "pendiente", finishedAt: null, noted: false })}
                className="w-full flex items-center justify-center gap-2 py-4 rounded-xl bg-stone-200 text-stone-700 text-base font-bold uppercase hover:bg-stone-300 active:scale-[0.98] transition"
              >
                <Clock size={18} /> Reabrir
              </button>
              <button
                onClick={() => patch({ noted: !localCar.noted })}
                className={`w-full flex items-center justify-center gap-2 py-3.5 rounded-xl text-sm font-bold uppercase border-2 active:scale-[0.98] transition ${
                  localCar.noted
                    ? "bg-green-50 text-green-700 border-green-500"
                    : "bg-white text-stone-500 border-stone-300 hover:border-stone-400"
                }`}
              >
                <CheckCircle2 size={16} /> {localCar.noted ? "Apuntado ✓" : "Marcar apuntado"}
              </button>
            </>
          )}
        </div>

        {!confirmDelete ? (
          <button
            onClick={() => setConfirmDelete(true)}
            className="text-sm font-bold text-black hover:text-red-500 flex items-center gap-1.5 mx-auto mb-6 py-2 px-3"
          >
            <Trash2 size={16} /> Eliminar vehículo del taller
          </button>
        ) : (
          <div className="text-center mb-6">
            <p className="text-sm font-semibold text-black mb-2">
              ¿Eliminar definitivamente esta ficha?
            </p>
            <div className="flex justify-center gap-2">
              <button
                onClick={() => onDelete(localCar.id)}
                className="text-sm font-bold bg-red-600 text-white px-4 py-2.5 rounded-lg"
              >
                Sí, eliminar
              </button>
              <button
                onClick={() => setConfirmDelete(false)}
                className="text-sm font-bold bg-stone-200 text-stone-700 px-4 py-2.5 rounded-lg"
              >
                Cancelar
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function ReturnsSection() {
  const [photos, setPhotos] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      const stored = (await storageGet(RETURNS_KEY)) || [];
      setPhotos(stored);
      setLoading(false);
    })();
  }, []);

  const persist = async (updated) => {
    setPhotos(updated);
    await storageSet(RETURNS_KEY, updated);
  };

  const addPhoto = (data) => {
    persist([{ id: uid(), data, supplier: "", createdAt: Date.now() }, ...photos]);
  };

  const updatePhoto = (updated) => {
    persist(photos.map((p) => (p.id === updated.id ? updated : p)));
  };

  const deletePhoto = (id) => {
    persist(photos.filter((p) => p.id !== id));
  };

  if (loading) {
    return <p className="text-sm text-black uppercase text-center py-8">Cargando...</p>;
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <h2 className="text-sm font-bold text-black uppercase tracking-wide">Devoluciones</h2>
        <PhotoPicker onPick={addPhoto} label="Añadir foto" small />
      </div>
      <div className="space-y-2.5">
        {photos.map((p) => (
          <ReturnPhotoCard key={p.id} photo={p} onUpdate={updatePhoto} onDelete={deletePhoto} />
        ))}
      </div>
      {photos.length === 0 && (
        <p className="text-sm font-medium text-black uppercase text-center py-8">
          Todavía no hay fotos de devoluciones.
        </p>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Acceso con contraseña (comprobación por hash, sin guardar
   la contraseña en texto plano en el código)
--------------------------------------------------------- */
// Hash SHA-256 de la contraseña de acceso. No es la contraseña en sí:
// es una huella digital de un solo sentido, no se puede "deshacer"
// para recuperar la contraseña original.
const ACCESS_PASSWORD_HASH =
  "ded5bd5485b9b5aa52f61b1a1fcf884e1b9e983f36f632239d5cb94cff54e671";

async function sha256Hex(text) {
  const encoded = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", encoded);
  return Array.from(new Uint8Array(digest))
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
}

function LoginGate({ children }) {
  const [unlocked, setUnlocked] = useState(false);
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [checking, setChecking] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setChecking(true);
    setError(null);
    const hash = await sha256Hex(password);
    if (hash === ACCESS_PASSWORD_HASH) {
      setUnlocked(true);
    } else {
      setError("Contraseña incorrecta.");
    }
    setChecking(false);
  };

  if (unlocked) return children;

  return (
    <div className="min-h-screen flex items-center justify-center bg-stone-100 p-4">
      <form
        onSubmit={handleSubmit}
        className="bg-white rounded-xl shadow-lg p-6 w-full max-w-xs"
      >
        <div className="flex flex-col items-center mb-4">
          <Wrench size={28} className="text-amber-600 mb-2" />
          <h1 className="text-lg font-bold text-black">Acceso al taller</h1>
        </div>
        <input
          type="password"
          autoFocus
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          placeholder="Contraseña"
          className="w-full px-3 py-3 text-base font-medium text-black rounded-lg border-2 border-stone-300 outline-none focus:border-amber-500 mb-3"
        />
        {error && <p className="text-sm font-semibold text-red-600 mb-3">{error}</p>}
        <button
          type="submit"
          disabled={checking || !password}
          className="w-full py-3 rounded-lg bg-amber-600 text-white font-bold uppercase disabled:opacity-50"
        >
          {checking ? "Comprobando..." : "Entrar"}
        </button>
      </form>
    </div>
  );
}

/* ---------------------------------------------------------
   App principal
--------------------------------------------------------- */
const CARS_INDEX_KEY = "workshop:cars:index";
const carKey = (id) => `workshop:cars:${id}`;
const ORDER_COUNTER_KEY = "workshop:orderCounter";

function App() {
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [cars, setCars] = useState([]);
  const [openId, setOpenId] = useState(null);
  const [filter, setFilter] = useState("pendiente");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [saveError, setSaveError] = useState(null);
  const openIdRef = useRef(openId);

  useEffect(() => {
    openIdRef.current = openId;
  }, [openId]);

  // Gestión del botón "atrás" del navegador/móvil:
  // - Si hay un vehículo abierto, "atrás" vuelve a la lista principal.
  // - Si estamos en la lista principal, "atrás" sale de la app normalmente.
  useEffect(() => {
    const handlePopState = () => {
      if (openIdRef.current) {
        // Estábamos en el detalle: volvemos a la lista y reponemos el estado base.
        setOpenId(null);
        window.history.pushState({ screen: "list" }, "");
      }
    };

    window.addEventListener("popstate", handlePopState);
    return () => window.removeEventListener("popstate", handlePopState);
  }, []);

  const openCarDetail = (id) => {
    window.history.pushState({ screen: "detail" }, "");
    setOpenId(id);
  };

  const closeCarDetail = () => {
    window.history.back();
  };


  const loadData = async ({ silent } = {}) => {
    if (!silent) {
      setLoading(true);
      setLoadError(null);
    }
    try {
      const index = (await storageGet(CARS_INDEX_KEY)) || [];
      const loaded = [];
      for (const id of index) {
        const c = await storageGet(carKey(id));
        if (c) loaded.push(c);
      }

      const missingCodes = loaded
        .filter((c) => !c.orderCode)
        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      if (missingCodes.length > 0) {
        let lastNumber = (await storageGet(ORDER_COUNTER_KEY)) || 0;
        for (const c of missingCodes) {
          lastNumber += 1;
          c.orderCode = `OT-${String(lastNumber).padStart(4, "0")}`;
          await storageSet(carKey(c.id), c);
        }
        await storageSet(ORDER_COUNTER_KEY, lastNumber);
      }

      setCars(loaded);
      if (!silent) setLoading(false);
    } catch (err) {
      console.error("Error cargando datos:", err);
      if (silent) {
        setSaveStatus("error");
        setSaveError((err && err.message) || String(err));
      } else {
        setLoadError((err && err.message) || String(err));
        setLoading(false);
      }
    }
  };

  useEffect(() => {
    loadData();
  }, []);

  const [sidebarOpen, setSidebarOpen] = useState(false);

  const handleRefresh = useCallback(() => loadData({ silent: true }), []);

  const persistIndex = async (list) => {
    try {
      await storageSet(
        CARS_INDEX_KEY,
        list.map((c) => c.id)
      );
    } catch (err) {
      console.error("Error guardando índice:", err);
      setSaveStatus("error");
      setSaveError((err && err.message) || String(err));
    }
  };

  const saveCar = async (car) => {
    setSaveStatus("saving");
    try {
      await storageSet(carKey(car.id), car);
      setSaveStatus("saved");
      setSaveError(null);
      setTimeout(() => setSaveStatus("idle"), 1200);
    } catch (err) {
      console.error("Error guardando coche:", err);
      setSaveStatus("error");
      setSaveError((err && err.message) || String(err));
    }
  };

  const handleCreate = async () => {
    let orderCode = "OT-0001";
    try {
      const lastNumber = (await storageGet(ORDER_COUNTER_KEY)) || 0;
      const nextNumber = lastNumber + 1;
      await storageSet(ORDER_COUNTER_KEY, nextNumber);
      orderCode = `OT-${String(nextNumber).padStart(4, "0")}`;
    } catch (err) {
      console.error("Error generando el código de orden:", err);
      orderCode = `OT-${uid()}`;
    }
    const newCar = {
      id: uid(),
      orderCode,
      brand: "",
      model: "",
      plate: "",
      km: "",
      clientName: "",
      clientPhone: "",
      parts: [],
      photos: [],
      clientPhotos: [],
      laborHours: "",
      mechanic: "",
      notes: "",
      status: "pendiente",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      finishedAt: null,
      noted: false,
    };
    const updated = [...cars, newCar];
    setCars(updated);
    openCarDetail(newCar.id);
    await saveCar(newCar);
    await persistIndex(updated);
  };

  const handleUpdateCar = async (updatedCar) => {
    setCars((prev) => prev.map((c) => (c.id === updatedCar.id ? updatedCar : c)));
    await saveCar(updatedCar);
  };

  const handleDeleteCar = async (id) => {
    const updated = cars.filter((c) => c.id !== id);
    setCars(updated);
    setOpenId(null);
    await persistIndex(updated);
  };

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-100">
        <p className="text-black text-sm font-medium uppercase">Cargando taller...</p>
      </div>
    );
  }

  if (loadError) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-100 px-6">
        <div className="max-w-sm w-full bg-white border border-red-200 rounded-xl p-5 text-center">
          <AlertCircle className="mx-auto text-red-500 mb-2" size={28} />
          <p className="text-stone-700 font-medium mb-1">No se pudieron cargar los datos</p>
          <p className="text-sm text-black break-words mb-4">{loadError}</p>
          <button
            onClick={loadData}
            className="w-full bg-amber-500 text-white text-sm font-medium py-2 rounded-lg hover:bg-amber-600 transition"
          >
            Reintentar
          </button>
        </div>
      </div>
    );
  }

  const openCar = cars.find((c) => c.id === openId);

  return (
    <div className="relative">
      {openCar ? (
        <CarDetail
          car={openCar}
          onBack={closeCarDetail}
          onUpdate={handleUpdateCar}
          onDelete={handleDeleteCar}
        />
      ) : (
        <CarListScreen
          cars={cars}
          onOpen={openCarDetail}
          onCreate={handleCreate}
          onRefresh={handleRefresh}
          filter={filter}
          setFilter={setFilter}
          onOpenSidebar={() => setSidebarOpen(true)}
        />
      )}

      <WorkshopSidebar
        open={sidebarOpen}
        onClose={() => setSidebarOpen(false)}
        cars={cars}
        onOpenCar={(id) => {
          setSidebarOpen(false);
          openCarDetail(id);
        }}
      />

      {saveStatus !== "idle" && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 max-w-[92vw]">
          <div
            className={`text-xs font-medium px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 ${
              saveStatus === "saving"
                ? "bg-stone-800 text-white"
                : saveStatus === "error"
                ? "bg-red-600 text-white"
                : "bg-green-600 text-white"
            }`}
          >
            {saveStatus === "saving" && <>Guardando...</>}
            {saveStatus === "saved" && (
              <>
                <Check size={12} /> Guardado
              </>
            )}
            {saveStatus === "error" && (
              <>
                <AlertCircle size={12} className="flex-shrink-0" />
                <span className="truncate">Error al guardar: {saveError}</span>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(
  <LoginGate>
    <App />
  </LoginGate>
);
</script>
</body>
</html>
