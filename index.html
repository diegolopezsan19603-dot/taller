/* ---------------------------------------------------------
   Configuración de Firebase
   Pega aquí el objeto firebaseConfig que te da la consola de
   Firebase (Configuración del proyecto > Tus apps > Web).
   Mientras esté sin rellenar, la app usa localStorage (solo
   este dispositivo) para no romperse.
--------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDjuhFdXuYFR8vC6qB5i0zXCJ616Pp7Mkk",
  authDomain: "taller-app-6fcbe.firebaseapp.com",
  projectId: "taller-app-6fcbe",
  storageBucket: "taller-app-6fcbe.firebasestorage.app",
  messagingSenderId: "269971019729",
  appId: "1:269971019729:web:c15713f8f6c07c4d4172f0",
};

const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "TU_API_KEY";

/* ---------------------------------------------------------
   Almacenamiento: localStorage (solo este dispositivo)
--------------------------------------------------------- */
const LS_PREFIX = "workshop-app:";

const localStorageAPI = {
  async get(key) {
    const raw = window.localStorage.getItem(LS_PREFIX + key);
    if (raw === null) return null;
    return { key, value: raw };
  },
  async set(key, value) {
    window.localStorage.setItem(LS_PREFIX + key, value);
    return { key, value };
  },
  async delete(key) {
    window.localStorage.removeItem(LS_PREFIX + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX)) {
        const short = k.slice(LS_PREFIX.length);
        if (!prefix || short.startsWith(prefix)) keys.push(short);
      }
    }
    return { keys };
  }
};

/* ---------------------------------------------------------
   Almacenamiento: Firestore (compartido entre dispositivos)
   Usa autenticación anónima: cada dispositivo entra sin
   pedir usuario/contraseña, pero queda autenticado, para que
   las reglas de Firestore puedan exigir "if request.auth != null".
--------------------------------------------------------- */
const FS_COLLECTION = "workshop_data";
let firestoreAPI = null;

if (FIREBASE_CONFIGURED) {
  const firebaseApp = initializeApp(firebaseConfig);
  // Detección automática de "long polling": en redes con proxies/firewalls
  // (wifi de taller, algunas operadoras) el canal normal se queda esperando
  // ~10 s antes de rendirse. Con esto cambia solo al modo compatible.
  const db = initializeFirestore(firebaseApp, { experimentalAutoDetectLongPolling: true });
  // La sesión anónima ahora se recuerda en el dispositivo (localStorage, que
  // no se cuelga como IndexedDB). Así, al abrir la app NO hay que volver a
  // iniciar sesión por red: funciona incluso sin cobertura. Si el navegador
  // no permite localStorage, cae a memoria como antes.
  const auth = initializeAuth(firebaseApp, {
    persistence: [browserLocalPersistence, inMemoryPersistence],
  });

  // Antes, si el primer inicio de sesión fallaba (poca cobertura), la promesa
  // quedaba rechazada PARA SIEMPRE y todos los guardados fallaban hasta
  // recargar la página. Ahora cada intento fallido se puede repetir.
  let authPromise = null;
  const ensureAuth = () => {
    if (authPromise) return authPromise;
    authPromise = new Promise((resolve, reject) => {
      let settled = false;
      let signingIn = false;
      let unsub = null;
      const finish = (fn, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (unsub) unsub();
        fn(value);
      };
      const timer = setTimeout(() => {
        const online = typeof navigator !== "undefined" ? navigator.onLine : "desconocido";
        finish(reject, new Error(
          `Tiempo de espera agotado iniciando sesión en Firebase (conexión: ${online}). Revisa la red o que el inicio de sesión anónimo esté activado en Firebase.`
        ));
      }, 15000);
      unsub = onAuthStateChanged(auth, (user) => {
        if (user) finish(resolve, user);
        else if (!signingIn) {
          signingIn = true;
          signInAnonymously(auth).catch((err) => finish(reject, err));
        }
      });
    });
    authPromise.catch(() => { authPromise = null; });
    return authPromise;
  };
  // Se inicia ya, mientras el mecánico escribe la contraseña.
  ensureAuth().catch(() => {});

  firestoreAPI = {
    async get(key) {
      await ensureAuth();
      const snap = await getDoc(doc(db, FS_COLLECTION, key));
      if (!snap.exists()) return null;
      return { key, value: snap.data().value };
    },
    // opts.light: documentos pesados (fotos) que no deben aparecer en las
    // consultas "qué ha cambiado desde…" (no llevan el campo updatedAt).
    async set(key, value, opts) {
      await ensureAuth();
      const payload = opts && opts.light ? { value, ts: Date.now() } : { value, updatedAt: Date.now() };
      await setDoc(doc(db, FS_COLLECTION, key), payload);
      return { key, value };
    },
    async delete(key) {
      await ensureAuth();
      await deleteDoc(doc(db, FS_COLLECTION, key));
      return { key, deleted: true };
    },
    async list(prefix) {
      await ensureAuth();
      const snap = await getDocs(collection(db, FS_COLLECTION));
      const keys = [];
      snap.forEach((d) => {
        if (!prefix || d.id.startsWith(prefix)) keys.push(d.id);
      });
      return { keys };
    },
    // Solo los documentos modificados desde una fecha (evita bajarlo todo).
    async changedSince(ts) {
      await ensureAuth();
      const snap = await getDocs(query(collection(db, FS_COLLECTION), where("updatedAt", ">", ts)));
      const rows = [];
      snap.forEach((d) => rows.push({ key: d.id, value: d.data().value }));
      return rows;
    },
    resetAuth() {
      authPromise = null;
    },
  };
}

window.storage = firestoreAPI || localStorageAPI;

/* ---------------------------------------------------------
   Utilidades y motor de almacenamiento local-primero
--------------------------------------------------------- */
// <engine>
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------------------------------------------------------
   Evita que una operación de red se quede "colgada" para
   siempre (poca cobertura): pasado el límite, se da por
   fallida y el motor de sincronización la reintenta solo.
--------------------------------------------------------- */
const SAVE_TIMEOUT_MS = 20000;
function withTimeout(promise, ms = SAVE_TIMEOUT_MS, message = "Sin respuesta del servidor. Comprueba tu conexión.") {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(message)), ms);
    promise.then(
      (val) => {
        clearTimeout(timer);
        resolve(val);
      },
      (err) => {
        clearTimeout(timer);
        reject(err);
      }
    );
  });
}

/* ---------------------------------------------------------
   Imágenes: foto completa (1000 px) + miniatura (360 px).
   La miniatura viaja dentro del documento del coche (pesa
   pocos KB); la foto completa se guarda aparte.
   Se usa URL.createObjectURL en vez de FileReader/base64:
   evita crear una cadena de ~15 MB con la foto original.
--------------------------------------------------------- */
const PHOTO_MAX_DIM = 1000;
const PHOTO_QUALITY = 0.7;
// Miniatura (la que se ve en la lista y en la galería de la ficha).
// Antes 360 px / 0.60; ahora 600 px / 0.78. Pesa unas 3-4 veces más, pero
// sigue siendo pequeña. THUMB_VERSION marca qué miniaturas ya tienen la
// resolución nueva (las antiguas se pueden mejorar desde el panel lateral).
const THUMB_MAX_DIM = 600;
const THUMB_QUALITY = 0.78;
const THUMB_VERSION = 2;
// Firestore admite 1 MiB por documento: no se mejora una ficha si con las
// miniaturas nuevas se acercara a ese límite.
const MAX_CAR_DOC_BYTES = 900000;

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new window.Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("No se pudo leer la imagen"));
    img.src = src;
  });
}

function drawScaled(img, maxDim, quality) {
  let width = img.naturalWidth || img.width;
  let height = img.naturalHeight || img.height;
  const scale = Math.min(1, maxDim / Math.max(width, height));
  width = Math.max(1, Math.round(width * scale));
  height = Math.max(1, Math.round(height * scale));
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  canvas.getContext("2d").drawImage(img, 0, 0, width, height);
  return canvas.toDataURL("image/jpeg", quality);
}

async function fileToPhotoPair(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    return {
      data: drawScaled(img, PHOTO_MAX_DIM, PHOTO_QUALITY),
      thumb: drawScaled(img, THUMB_MAX_DIM, THUMB_QUALITY),
    };
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function makeThumb(dataUrl) {
  const img = await loadImage(dataUrl);
  return drawScaled(img, THUMB_MAX_DIM, THUMB_QUALITY);
}

/* ---------------------------------------------------------
   Claves de almacenamiento remoto
--------------------------------------------------------- */
const CARS_INDEX_KEY = "workshop:cars:index";
const CAR_PREFIX = "workshop:cars:";
const carKey = (id) => `${CAR_PREFIX}${id}`;
const photoKey = (id) => `workshop:photo:${id}`;
const ORDER_COUNTER_KEY = "workshop:orderCounter";
// Se actualiza cada vez que alguien guarda un cambio. Sirve para saber,
// sin recargar todo, si otro dispositivo ha modificado algo.
const CHANGE_MARKER_KEY = "workshop:lastChangeAt";

/* ---------------------------------------------------------
   Base de datos local del dispositivo (IndexedDB)
   - Guarda coches, fotos y la cola de cosas por subir.
   - Si IndexedDB no está disponible o se cuelga (algunos
     navegadores móviles / modo privado), cae a memoria y
     avisa con `isDegraded()`.
--------------------------------------------------------- */
const LocalDB = (() => {
  const DB_NAME = "taller-local";
  const STORE = "kv";
  const mem = new Map();
  let dbPromise = null;
  let degraded = false;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve) => {
      let done = false;
      const finish = (db) => {
        if (done) {
          if (db) {
            try { db.close(); } catch {}
          }
          return;
        }
        done = true;
        if (!db) degraded = true;
        resolve(db);
      };
      if (typeof indexedDB === "undefined" || !indexedDB) return finish(null);
      const timer = setTimeout(() => finish(null), 5000);
      try {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
        };
        req.onsuccess = () => {
          clearTimeout(timer);
          const db = req.result;
          db.onversionchange = () => db.close();
          finish(db);
        };
        req.onerror = () => {
          clearTimeout(timer);
          finish(null);
        };
      } catch {
        clearTimeout(timer);
        finish(null);
      }
    });
    return dbPromise;
  }

  async function idb(fn) {
    const db = await open();
    if (!db) throw new Error("sin-indexeddb");
    try {
      return await fn(db);
    } catch (e) {
      if (e && e.name === "InvalidStateError") dbPromise = null; // conexión cerrada: se reabrirá
      throw e;
    }
  }

  async function get(key) {
    if (mem.has(key)) return mem.get(key);
    try {
      return await idb(
        (db) =>
          new Promise((res, rej) => {
            const r = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
          })
      );
    } catch {
      return undefined;
    }
  }

  // Devuelve true si quedó guardado de forma duradera (IndexedDB).
  async function put(key, value) {
    try {
      await idb(
        (db) =>
          new Promise((res, rej) => {
            const t = db.transaction(STORE, "readwrite");
            t.objectStore(STORE).put(value, key);
            t.oncomplete = () => res();
            t.onerror = () => rej(t.error);
            t.onabort = () => rej(t.error || new Error("abortado"));
          })
      );
      mem.delete(key);
      return true;
    } catch (e) {
      console.warn("IndexedDB: no se pudo guardar, se usa memoria", e);
      mem.set(key, value);
      degraded = true;
      return false;
    }
  }

  async function del(key) {
    mem.delete(key);
    try {
      await idb(
        (db) =>
          new Promise((res, rej) => {
            const t = db.transaction(STORE, "readwrite");
            t.objectStore(STORE).delete(key);
            t.oncomplete = () => res();
            t.onerror = () => rej(t.error);
            t.onabort = () => rej(t.error || new Error("abortado"));
          })
      );
    } catch {}
  }

  async function entries(prefix) {
    const out = new Map();
    try {
      await idb(
        (db) =>
          new Promise((res, rej) => {
            const range = IDBKeyRange.bound(prefix, prefix + "\uffff");
            const r = db.transaction(STORE, "readonly").objectStore(STORE).openCursor(range);
            r.onsuccess = () => {
              const c = r.result;
              if (c) {
                out.set(c.key, c.value);
                c.continue();
              } else res();
            };
            r.onerror = () => rej(r.error);
          })
      );
    } catch {}
    mem.forEach((v, k) => {
      if (k.startsWith(prefix)) out.set(k, v);
    });
    return out;
  }

  async function keys(prefix) {
    const out = new Set();
    try {
      await idb(
        (db) =>
          new Promise((res, rej) => {
            const range = IDBKeyRange.bound(prefix, prefix + "\uffff");
            const r = db.transaction(STORE, "readonly").objectStore(STORE).getAllKeys(range);
            r.onsuccess = () => {
              r.result.forEach((k) => out.add(k));
              res();
            };
            r.onerror = () => rej(r.error);
          })
      );
    } catch {}
    mem.forEach((_, k) => {
      if (k.startsWith(prefix)) out.add(k);
    });
    return [...out];
  }

  return { get, put, del, entries, keys, isDegraded: () => degraded };
})();

/* ---------------------------------------------------------
   Motor "local primero"

   Regla de oro: TODO cambio (texto o foto) se guarda primero
   en el dispositivo y se apunta en una cola de "pendiente de
   subir". Después se sube al servidor en segundo plano con
   reintentos automáticos (al recuperar cobertura, al volver
   a la app y cada 15 s). Nada se borra de la cola hasta que
   el servidor lo ha confirmado.

   - Las fotos completas van en documentos aparte
     ("workshop:photo:<id>"), no dentro del coche: así el
     documento del coche pesa poco (límite de Firestore: 1 MiB)
     y la lista carga rápido. Dentro del coche solo va la
     miniatura.
   - Al abrir, se muestra al instante lo guardado en el móvil
     y se sincroniza en segundo plano (solo baja lo que cambió).
--------------------------------------------------------- */
const LocalFirst = (() => {
  const cars = new Map(); // id -> coche (copia en memoria de lo guardado localmente)
  const outbox = new Map(); // "tipo:id" -> { kind, id, rev, perm?, error? }
  const saveChains = new Map(); // id -> promesa del guardado local en curso
  const migrated = new Map(); // id de foto antigua -> miniatura ya generada
  const subs = new Set();
  const carSubs = new Set();

  const state = {
    ready: false,
    hasSynced: false,
    pending: 0,
    permFailed: 0,
    permError: null,
    pulling: false,
    pushing: false,
    syncing: false,
    online: typeof navigator === "undefined" ? true : navigator.onLine !== false,
    lastError: null,
    lastSyncAt: 0,
    degraded: false,
    stale: false,
    progress: null,
  };

  const PULL_CONCURRENCY = 6;
  const DELTA_MARGIN_MS = 60 * 60 * 1000; // margen por si los relojes de los móviles no coinciden
  const FULL_PULL_EVERY_MS = 12 * 60 * 60 * 1000;
  const MAX_CACHED_PHOTOS = 300;
  const PHOTO_UPLOAD_TIMEOUT_MS = 60000;

  let marker = 0;

  /* ---- estado y suscripciones ---- */
  function recount() {
    state.pending = outbox.size;
    let perm = 0;
    let permError = null;
    outbox.forEach((e) => {
      if (e.perm) {
        perm++;
        permError = permError || e.error || "Error desconocido";
      }
    });
    state.permFailed = perm;
    state.permError = permError;
    state.degraded = LocalDB.isDegraded();
    state.syncing = state.pulling || state.pushing;
  }
  function emit() {
    recount();
    const snap = { ...state };
    subs.forEach((fn) => {
      try { fn(snap); } catch {}
    });
  }
  let carsTimer = null;
  function emitCars() {
    if (carsTimer) return;
    carsTimer = setTimeout(() => {
      carsTimer = null;
      const list = getCars();
      carSubs.forEach((fn) => {
        try { fn(list); } catch {}
      });
    }, 60);
  }
  const getCars = () => [...cars.values()];
  const getState = () => {
    recount();
    return { ...state };
  };
  function subscribe(fn) {
    subs.add(fn);
    return () => subs.delete(fn);
  }
  function onCars(fn) {
    carSubs.add(fn);
    return () => carSubs.delete(fn);
  }

  function friendlyError(err) {
    const code = err && err.code;
    const msg = (err && err.message) || String(err);
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "Sin conexión";
    if (code === "permission-denied" || code === "unauthenticated")
      return "Firebase ha rechazado el acceso (revisa las reglas o el inicio de sesión anónimo)";
    if (code === "resource-exhausted") return "Se ha agotado la cuota de Firebase";
    if (/exceeds the maximum|maximum size|too large/i.test(msg)) return "Documento demasiado grande para Firebase";
    return msg;
  }
  function isPermanent(err) {
    const code = err && err.code;
    const msg = (err && err.message) || "";
    return code === "invalid-argument" || /exceeds the maximum|maximum size|too large/i.test(msg);
  }
  function noteError(err) {
    state.lastError = friendlyError(err);
    emit();
  }

  /* ---- acceso al servidor (estricto: si falla, lanza error) ---- */
  const Remote = {
    async get(key, ms = 25000) {
      const r = await withTimeout(window.storage.get(key), ms);
      return r ? JSON.parse(r.value) : null;
    },
    async set(key, value, ms = 25000, opts) {
      await withTimeout(window.storage.set(key, JSON.stringify(value), opts), ms);
    },
    async del(key, ms = 25000) {
      await withTimeout(window.storage.delete(key), ms);
    },
    async changedSince(ts, ms = 30000) {
      if (typeof window.storage.changedSince !== "function") throw new Error("delta-no-soportado");
      return withTimeout(window.storage.changedSince(ts), ms);
    },
  };

  /* ---- exclusión mutua: no se mezcla subir con bajar ---- */
  let lockChain = Promise.resolve();
  function withLock(fn) {
    const run = lockChain.then(fn);
    lockChain = run.catch(() => {});
    return run;
  }

  /* ---- cola de pendientes ---- */
  function queue(kind, id, extra = {}) {
    const key = kind + ":" + id;
    const prev = outbox.get(key);
    const entry = { kind, id, rev: (prev ? prev.rev : 0) + 1, ...extra };
    if (kind === "index") {
      entry.remove = Array.from(new Set([...((prev && prev.remove) || []), ...(extra.remove || [])]));
    }
    outbox.set(key, entry);
    emit();
    scheduleFlush();
    return LocalDB.put("pend:" + key, entry);
  }
  function unqueue(key) {
    outbox.delete(key);
    return LocalDB.del("pend:" + key);
  }
  async function dequeueIfSame(key, rev) {
    const cur = outbox.get(key);
    if (cur && cur.rev === rev) await unqueue(key);
    emit();
  }
  const hasWork = () => [...outbox.values()].some((e) => !e.perm);

  let flushTimer = null;
  function scheduleFlush(delay = 300) {
    if (flushTimer) return;
    flushTimer = setTimeout(() => {
      flushTimer = null;
      flush().catch(() => {});
    }, delay);
  }

  /* ---- utilidades de fotos ---- */
  function photoIdsOf(car) {
    const ids = [];
    (car.photos || []).forEach((p) => p && p.id && ids.push(p.id));
    (car.clientPhotos || []).forEach((p) => p && p.id && ids.push(p.id));
    (car.parts || []).forEach((pt) => pt && pt.photo && pt.photo.id && ids.push(pt.photo.id));
    return ids;
  }
  function legacyPhotosOf(car) {
    let n = 0;
    (car.photos || []).forEach((p) => p && p.data && n++);
    (car.clientPhotos || []).forEach((p) => p && p.data && n++);
    (car.parts || []).forEach((pt) => pt && pt.photo && pt.photo.data && n++);
    return n;
  }
  const countLegacyPhotos = (list) => list.reduce((sum, c) => sum + legacyPhotosOf(c), 0);

  // Foto antigua (con la imagen completa dentro del coche) -> foto nueva
  // (miniatura en el coche + imagen completa aparte).
  async function prepareCar(car) {
    if (legacyPhotosOf(car) === 0) return car;
    const migrateOne = async (p) => {
      if (!p || !p.data) return p;
      let thumb = migrated.get(p.id);
      if (!thumb) {
        thumb = await makeThumb(p.data).catch(() => null);
        if (!thumb) return p; // no se pudo: se deja como estaba
        await savePhotoLocal(p.id, p.data);
        migrated.set(p.id, thumb);
      }
      return { id: p.id, thumb, v: THUMB_VERSION };
    };
    const photos = await Promise.all((car.photos || []).map(migrateOne));
    const clientPhotos = await Promise.all((car.clientPhotos || []).map(migrateOne));
    const parts = await Promise.all(
      (car.parts || []).map(async (pt) => (pt && pt.photo ? { ...pt, photo: await migrateOne(pt.photo) } : pt))
    );
    return { ...car, photos, clientPhotos, parts };
  }

  /* ---- mejora de miniaturas ya subidas ---- */
  const mapCarPhotos = (car, fn) => ({
    ...car,
    photos: (car.photos || []).map(fn),
    clientPhotos: (car.clientPhotos || []).map(fn),
    parts: (car.parts || []).map((pt) => (pt && pt.photo ? { ...pt, photo: fn(pt.photo) } : pt)),
  });
  const isOldThumb = (p) => !!(p && p.id && p.thumb && !p.data && (p.v || 0) < THUMB_VERSION);
  function oldThumbsOf(car) {
    let n = 0;
    mapCarPhotos(car, (p) => {
      if (isOldThumb(p)) n++;
      return p;
    });
    return n;
  }
  const countOldThumbs = (list) => list.reduce((sum, c) => sum + oldThumbsOf(c), 0);

  // Vuelve a generar las miniaturas a partir de la foto completa (1000 px),
  // que está en el móvil o en Firebase. No hace falta volver a subir la foto.
  async function upgradeThumbs(onProgress) {
    await syncNow({ full: true }); // primero se baja lo último, para no pisar cambios de otros
    const targets = getCars().filter((c) => oldThumbsOf(c) > 0);
    let upgraded = 0;
    let skipped = 0;
    let failed = 0;
    let done = 0;
    for (const c of targets) {
      const updates = new Map();
      const todo = [];
      mapCarPhotos(c, (p) => {
        if (isOldThumb(p)) todo.push(p);
        return p;
      });
      await Promise.all(
        todo.map(async (p) => {
          try {
            const full = await getFullPhoto(p.id);
            if (!full) return void failed++;
            updates.set(p.id, { thumb: await makeThumb(full), v: THUMB_VERSION });
          } catch {
            failed++;
          }
        })
      );
      // Se aplica sobre la versión ACTUAL de la ficha (por si se editó mientras tanto).
      const current = cars.get(c.id);
      if (current && updates.size > 0) {
        const next = mapCarPhotos(current, (p) => (p && updates.has(p.id) ? { ...p, ...updates.get(p.id) } : p));
        if (JSON.stringify(next).length > MAX_CAR_DOC_BYTES) skipped += updates.size;
        else {
          await saveCarLocal(next);
          upgraded += updates.size;
        }
      }
      done++;
      if (onProgress) onProgress(done, targets.length);
    }
    flush().catch(() => {});
    return { upgraded, skipped, failed };
  }

  /* ---- operaciones locales (lo que usa la interfaz) ---- */
  async function savePhotoLocal(id, data) {
    const durable = await LocalDB.put("photo:" + id, data);
    queue("photo", id);
    return durable;
  }

  async function getFullPhoto(id) {
    const local = await LocalDB.get("photo:" + id);
    if (local) return local;
    const rec = await Remote.get(photoKey(id), 45000);
    if (rec && rec.data) {
      LocalDB.put("photo:" + id, rec.data);
      return rec.data;
    }
    return null;
  }

  async function doSaveCar(car, removed) {
    let prepared = car;
    try {
      prepared = await prepareCar(car);
    } catch (e) {
      console.warn("No se pudieron optimizar las fotos de este coche:", e);
    }
    if (cars.get(car.id) === car) cars.set(car.id, prepared);
    await LocalDB.put("car:" + car.id, prepared);
    for (const pid of removed) {
      await unqueue("photo:" + pid);
      await LocalDB.del("photo:" + pid);
      await queue("delphoto", pid);
    }
    emitCars();
  }

  function saveCarLocal(input) {
    let car = input;
    const cur = cars.get(car.id);
    // Si el código de orden ya se asignó, no se pierde por una edición con la ficha antigua.
    if (cur && cur.orderCode && !car.orderCode) car = { ...car, orderCode: cur.orderCode };
    const nowIds = new Set(photoIdsOf(car));
    const removed = cur ? photoIdsOf(cur).filter((pid) => !nowIds.has(pid)) : [];

    // Parte síncrona: la interfaz y la cola ya "saben" del cambio antes de esperar a nada.
    cars.set(car.id, car);
    queue("car", car.id);
    emitCars();

    const prevChain = saveChains.get(car.id) || Promise.resolve();
    const next = prevChain.then(() => doSaveCar(car, removed));
    const tracked = next
      .catch(() => {})
      .then(() => {
        if (saveChains.get(car.id) === tracked) saveChains.delete(car.id);
      });
    saveChains.set(car.id, tracked);
    return next;
  }

  async function createCarLocal(car) {
    queue("index", "main");
    return saveCarLocal(car);
  }

  async function deleteCarLocal(id) {
    const car = cars.get(id);
    cars.delete(id);
    emitCars();
    await unqueue("car:" + id);
    const pids = car ? photoIdsOf(car) : [];
    for (const pid of pids) {
      await unqueue("photo:" + pid);
      await LocalDB.del("photo:" + pid);
    }
    await LocalDB.del("car:" + id);
    await queue("delcar", id, { photoIds: pids });
    await queue("index", "main", { remove: [id] });
  }

  /* ---- subida (local -> servidor) ---- */
  async function pushPhoto(e) {
    const data = await LocalDB.get("photo:" + e.id);
    if (!data) return "gone";
    await Remote.set(photoKey(e.id), { data }, PHOTO_UPLOAD_TIMEOUT_MS, { light: true });
    return "ok";
  }

  async function pushCar(e) {
    await (saveChains.get(e.id) || Promise.resolve());
    const car = cars.get(e.id);
    if (!car) return "gone";
    // No se sube el coche mientras alguna de sus fotos siga sin subir:
    // así nunca queda una miniatura apuntando a una foto que no existe.
    const blocked = photoIdsOf(car).some((pid) => {
      const pe = outbox.get("photo:" + pid);
      return pe && !pe.perm;
    });
    if (blocked) return "skip";
    await Remote.set(carKey(car.id), car, 30000);
    return "ok";
  }

  async function pushDelCar(e) {
    await Remote.del(carKey(e.id));
    for (const pid of e.photoIds || []) await Remote.del(photoKey(pid));
    return "ok";
  }

  async function pushDelPhoto(e) {
    await Remote.del(photoKey(e.id));
    return "ok";
  }

  async function pushIndex(e) {
    // Mientras haya coches por subir, el índice espera (los coches se suben antes).
    const carPending = [...outbox.values()].some((x) => x.kind === "car" && !x.perm);
    if (carPending) return "skip";
    const server = (await Remote.get(CARS_INDEX_KEY)) || [];
    const remove = new Set(e.remove || []);
    const merged = new Set(server.filter((id) => !remove.has(id)));
    cars.forEach((_, id) => merged.add(id));
    const same = merged.size === server.length && server.every((id) => merged.has(id));
    if (!same) await Remote.set(CARS_INDEX_KEY, [...merged]);
    return "ok";
  }

  async function applyCode(id, code) {
    const cur = cars.get(id);
    if (!cur) return;
    const next = { ...cur, orderCode: code };
    cars.set(id, next);
    await LocalDB.put("car:" + id, next);
    emitCars();
  }

  // Los coches creados sin conexión no tienen código OT-xxxx todavía: se asigna al sincronizar.
  async function assignCodes() {
    const need = [...outbox.values()]
      .filter((e) => e.kind === "car" && !e.perm)
      .map((e) => cars.get(e.id))
      .filter((c) => c && !c.orderCode)
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (need.length === 0) return "ok";
    try {
      let last = (await Remote.get(ORDER_COUNTER_KEY)) || 0;
      for (const c of need) {
        last += 1;
        await Remote.set(ORDER_COUNTER_KEY, last);
        await applyCode(c.id, `OT-${String(last).padStart(4, "0")}`);
      }
      return "ok";
    } catch (err) {
      noteError(err);
      return "net";
    }
  }

  async function attempt(e, fn) {
    const key = e.kind + ":" + e.id;
    try {
      const r = await fn(e);
      if (r === "skip") return "skip";
      await dequeueIfSame(key, e.rev);
      return "ok";
    } catch (err) {
      noteError(err);
      if (isPermanent(err)) {
        const cur = outbox.get(key);
        if (cur) {
          cur.perm = true;
          cur.error = friendlyError(err);
          await LocalDB.put("pend:" + key, cur);
        }
        emit();
        return "perm";
      }
      if (err && (err.code === "permission-denied" || err.code === "unauthenticated")) {
        try { window.storage.resetAuth && window.storage.resetAuth(); } catch {}
      }
      return "net";
    }
  }

  async function flushLoop() {
    if (!hasWork()) return;
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      emit();
      return;
    }
    state.pushing = true;
    emit();
    let pushedCar = false;
    let networkDown = false;
    try {
      const kinds = [
        ["photo", pushPhoto],
        ["car", pushCar],
        ["delcar", pushDelCar],
        ["delphoto", pushDelPhoto],
        ["index", pushIndex],
      ];
      outer: for (const [kind, fn] of kinds) {
        if (kind === "car") {
          if ((await assignCodes()) === "net") {
            networkDown = true;
            break;
          }
        }
        const batch = [...outbox.values()].filter((x) => x.kind === kind && !x.perm);
        for (const e of batch) {
          const r = await attempt(e, fn);
          if (r === "net") {
            networkDown = true;
            break outer;
          }
          if (r === "ok" && kind === "car") pushedCar = true;
        }
      }
    } finally {
      state.pushing = false;
      if (pushedCar) bumpMarker();
      if (!networkDown) state.lastError = null;
      emit();
    }
  }
  const flush = () => withLock(flushLoop);

  function bumpMarker() {
    const now = Date.now();
    marker = now;
    state.stale = false;
    Remote.set(CHANGE_MARKER_KEY, now, 15000).catch(() => {});
  }

  /* ---- bajada (servidor -> local) ---- */
  async function pullImpl({ full = false } = {}) {
    const startedAt = Date.now();

    let markerAtStart = startedAt;
    try {
      markerAtStart = (await Remote.get(CHANGE_MARKER_KEY, 15000)) || startedAt;
    } catch {}

    const rawIndex = await Remote.get(CARS_INDEX_KEY);
    const serverIds = Array.isArray(rawIndex) ? rawIndex : [];
    const lastPull = (await LocalDB.get("meta:lastPull")) || 0;
    const lastFull = (await LocalDB.get("meta:lastFullPull")) || 0;
    const needFull = full || !lastPull || !lastFull || startedAt - lastFull > FULL_PULL_EVERY_MS;

    const deleting = new Set([...outbox.values()].filter((e) => e.kind === "delcar").map((e) => e.id));
    const prefetched = new Map();
    let useDelta = false;
    if (!needFull) {
      try {
        const rows = await Remote.changedSince(lastPull - DELTA_MARGIN_MS);
        for (const row of rows) {
          if (!row.key.startsWith(CAR_PREFIX) || row.key === CARS_INDEX_KEY) continue;
          try {
            prefetched.set(row.key.slice(CAR_PREFIX.length), JSON.parse(row.value));
          } catch {}
        }
        useDelta = true;
      } catch {
        useDelta = false; // sin consulta por fecha: se baja todo (en paralelo)
      }
    }

    const toFetch = new Set();
    for (const id of serverIds) {
      if (deleting.has(id) || prefetched.has(id)) continue;
      if (!useDelta || !cars.has(id)) toFetch.add(id);
    }

    const total = toFetch.size + prefetched.size;
    let done = 0;
    state.progress = total > 0 ? { done: 0, total } : null;
    emit();

    const failures = [];
    let firstErr = null;
    const missing = []; // en el índice pero sin documento

    const mergeCar = async (id, car) => {
      if (!car || typeof car !== "object") return;
      if (deleting.has(id) || outbox.has("car:" + id)) return; // hay cambios locales sin subir: mandan ellos
      cars.set(id, car);
      await LocalDB.put("car:" + id, car);
    };
    const tick = () => {
      done++;
      state.progress = { done, total };
      emit();
      emitCars();
    };

    for (const [id, car] of prefetched) {
      await mergeCar(id, car);
      tick();
    }

    const pendingIds = [...toFetch];
    const worker = async () => {
      while (pendingIds.length) {
        const id = pendingIds.shift();
        try {
          const car = await Remote.get(carKey(id), 30000);
          if (car === null) missing.push(id);
          else await mergeCar(id, car);
        } catch (err) {
          failures.push(id);
          firstErr = firstErr || err;
        }
        tick();
      }
    };
    await Promise.all(Array.from({ length: Math.min(PULL_CONCURRENCY, pendingIds.length) }, worker));

    // Coches que ya no existen en el servidor (borrados desde otro móvil)
    const serverSet = new Set(serverIds);
    const removeFromIndex = [];
    for (const id of missing) {
      if (!outbox.has("car:" + id)) {
        cars.delete(id);
        await LocalDB.del("car:" + id);
      }
      removeFromIndex.push(id);
    }
    if (failures.length === 0) {
      const candidates = [...cars.keys()].filter(
        (id) => !serverSet.has(id) && !prefetched.has(id) && !outbox.has("car:" + id) && !outbox.has("index:main")
      );
      for (const id of candidates) {
        try {
          const car = await Remote.get(carKey(id), 20000);
          if (car === null) {
            cars.delete(id);
            await LocalDB.del("car:" + id);
          } else {
            queue("index", "main"); // el coche existe pero faltaba en el índice: se repara
          }
        } catch {}
      }
    }
    if (removeFromIndex.length) queue("index", "main", { remove: removeFromIndex });

    // Coches antiguos sin código de orden: se les asigna uno (como hacía la versión anterior).
    if (needFull && failures.length === 0) {
      cars.forEach((c, id) => {
        if (!c.orderCode && !outbox.has("car:" + id)) queue("car", id);
      });
    }

    if (failures.length === 0) {
      await LocalDB.put("meta:lastPull", startedAt);
      if (needFull) await LocalDB.put("meta:lastFullPull", startedAt);
      state.hasSynced = true;
      marker = markerAtStart;
      state.stale = false;
    }
    emitCars();
    if (failures.length > 0) throw firstErr;
  }

  let syncPromise = null;
  function syncNow({ full = false } = {}) {
    if (syncPromise) return syncPromise;
    syncPromise = (async () => {
      state.pulling = true;
      state.lastError = null;
      emit();
      try {
        await withLock(() => pullImpl({ full }));
        state.lastSyncAt = Date.now();
        state.lastError = null;
      } catch (err) {
        noteError(err);
        throw err;
      } finally {
        state.pulling = false;
        state.progress = null;
        syncPromise = null;
        emit();
        emitCars();
        if (hasWork()) flush().catch(() => {});
      }
    })();
    return syncPromise;
  }

  // Reintento manual: quita las marcas de "error permanente" y vuelve a intentarlo todo.
  function retryNow() {
    outbox.forEach((e) => {
      if (e.perm) {
        e.perm = false;
        e.error = null;
        LocalDB.put("pend:" + e.kind + ":" + e.id, e);
      }
    });
    emit();
    return flush();
  }

  // Convierte todas las fotos antiguas (imagen completa dentro del coche).
  async function migrateLegacy(onProgress) {
    await syncNow({ full: true }); // primero se baja lo último, para no pisar cambios de otros
    const targets = getCars().filter((c) => legacyPhotosOf(c) > 0);
    let done = 0;
    for (const c of targets) {
      const latest = cars.get(c.id);
      if (latest && legacyPhotosOf(latest) > 0) await saveCarLocal(latest);
      done++;
      if (onProgress) onProgress(done, targets.length);
    }
    flush().catch(() => {});
    return targets.length;
  }

  /* ---- arranque y tareas de fondo ---- */
  async function pollMarker() {
    if (typeof document !== "undefined" && document.hidden) return;
    try {
      const m = (await Remote.get(CHANGE_MARKER_KEY, 10000)) || 0;
      if (m > marker && !state.stale) {
        state.stale = true;
        emit();
      }
    } catch {}
  }

  let started = false;
  function startBackground(opts = {}) {
    if (started) return;
    started = true;
    window.addEventListener("online", () => {
      state.online = true;
      emit();
      flush().catch(() => {});
      syncNow().catch(() => {});
    });
    window.addEventListener("offline", () => {
      state.online = false;
      emit();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (hasWork()) flush().catch(() => {});
        if (opts.pollMarker) pollMarker();
      }
    });
    setInterval(() => {
      if (hasWork()) flush().catch(() => {});
    }, 15000);
    if (opts.pollMarker) setInterval(pollMarker, 20000);
    // Pide al navegador que no borre estos datos si hay poco espacio.
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch {}
  }

  // Borra las fotos más antiguas guardadas en caché (nunca las que están por subir).
  async function prunePhotos() {
    try {
      const ids = (await LocalDB.keys("photo:"))
        .map((k) => k.slice(6))
        .filter((id) => !outbox.has("photo:" + id))
        .sort();
      const excess = ids.length - MAX_CACHED_PHOTOS;
      for (let i = 0; i < excess; i++) await LocalDB.del("photo:" + ids[i]);
    } catch {}
  }

  let initPromise = null;
  function init() {
    if (initPromise) return initPromise;
    initPromise = (async () => {
      const carEntries = await LocalDB.entries("car:");
      carEntries.forEach((v) => {
        if (v && v.id) cars.set(v.id, v);
      });
      const pend = await LocalDB.entries("pend:");
      pend.forEach((v, k) => {
        if (v && v.kind) {
          v.perm = false; // tras reiniciar se vuelve a intentar
          outbox.set(k.slice(5), v);
        }
      });
      state.hasSynced = !!(await LocalDB.get("meta:lastPull"));
      state.ready = true;
      emit();
      setTimeout(prunePhotos, 3000);
      return getCars();
    })();
    return initPromise;
  }

  let bootPromise = null;
  function boot(opts = {}) {
    if (!bootPromise) {
      bootPromise = init().then((list) => {
        startBackground(opts);
        syncNow().catch(() => {});
        return list;
      });
    }
    return bootPromise;
  }

  return {
    boot, init, startBackground,
    getCars, getState, subscribe, onCars,
    saveCarLocal, createCarLocal, deleteCarLocal,
    savePhotoLocal, getFullPhoto,
    syncNow, flush, retryNow, migrateLegacy, countLegacyPhotos, upgradeThumbs, countOldThumbs,
  };
})();
// </engine>


/* ---------------------------------------------------------
   Hooks de React para el motor local
--------------------------------------------------------- */
function useSyncState() {
  const [s, setS] = useState(() => LocalFirst.getState());
  useEffect(() => {
    setS(LocalFirst.getState());
    return LocalFirst.subscribe(setS);
  }, []);
  return s;
}

// Devuelve la foto completa de una foto (miniatura mientras carga).
// Fotos antiguas: la imagen viene dentro del propio coche (p.data).
// Fotos nuevas: se busca en el móvil y, si no está, se descarga.
function useFullPhoto(photo) {
  const id = photo ? photo.id : null;
  const inline = photo ? photo.data : null;
  const [full, setFull] = useState(inline || null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    setFailed(false);
    if (!id) {
      setFull(null);
      return;
    }
    if (inline) {
      setFull(inline);
      return;
    }
    let cancelled = false;
    setFull(null);
    LocalFirst.getFullPhoto(id)
      .then((d) => {
        if (cancelled) return;
        if (d) setFull(d);
        else setFailed(true);
      })
      .catch(() => {
        if (!cancelled) setFailed(true);
      });
    return () => {
      cancelled = true;
    };
  }, [id, inline]);
  const preview = photo ? photo.thumb || photo.data || null : null;
  return { src: full || preview, full, loading: !!id && !full && !failed, failed };
}

/* ---------------------------------------------------------
   Componente: input/textarea que convierte a mayúsculas sin
   que el cursor salte al final al escribir en medio del texto.

   Por qué ocurría: al escribir una letra en minúscula en medio
   de una palabra, el valor completo se sustituía por su versión
   en mayúsculas. Aunque la posición (índice) del cursor no
   cambia, algunos navegadores (sobre todo en móvil, con el
   corrector/autocompletado activo) pierden la selección al
   recibir un valor "distinto" y la mandan al final.

   Solución: guardamos en qué posición estaba el cursor justo
   antes de aplicar el cambio y, una vez React actualiza el
   value en el DOM, la restauramos explícitamente.
--------------------------------------------------------- */
function UppercaseField({ as = "input", value, onChange, inputRef, ...props }) {
  const localRef = useRef(null);
  const cursorRef = useRef(null);

  const setRefs = (node) => {
    localRef.current = node;
    if (typeof inputRef === "function") inputRef(node);
    else if (inputRef) inputRef.current = node;
  };

  const handleChange = (e) => {
    const start = e.target.selectionStart;
    const end = e.target.selectionEnd;
    const upper = e.target.value.toUpperCase();
    cursorRef.current = { start, end };
    onChange(upper);
  };

  useEffect(() => {
    if (cursorRef.current && localRef.current) {
      const { start, end } = cursorRef.current;
      cursorRef.current = null;
      // Solo tiene sentido restaurar la selección si el elemento
      // sigue siendo el que el usuario estaba usando.
      if (document.activeElement === localRef.current) {
        localRef.current.setSelectionRange(start, end);
      }
    }
  });

  const Tag = as;
  return <Tag ref={setRefs} value={value} onChange={handleChange} {...props} />;
}

/* ---------------------------------------------------------
   Componente: subida de foto
--------------------------------------------------------- */
function PhotoPicker({ onPick, label = "Añadir foto", small }) {
  const cameraRef = useRef(null);
  const galleryRef = useRef(null);
  const btnRef = useRef(null);
  const [loading, setLoading] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [menuPos, setMenuPos] = useState({ top: 0, left: 0 });

  const handleChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setLoading(true);
    try {
      const { data, thumb } = await fileToPhotoPair(file);
      const id = uid();
      // 1) Se guarda YA en el móvil: sobrevive a cortes de cobertura,
      //    cierres de la app y recargas.
      await LocalFirst.savePhotoLocal(id, data);
      // 2) Se entrega a la ficha; la subida a Firebase va en segundo plano
      //    y se reintenta sola hasta que el servidor la confirme.
      onPick({ id, thumb, v: THUMB_VERSION });
    } catch (err) {
      console.error("No se pudo procesar la foto:", err);
      window.alert("No se pudo procesar la foto. Inténtalo de nuevo.");
    } finally {
      setLoading(false);
      e.target.value = "";
    }
  };

  const MENU_WIDTH = 160; // w-40

  const openMenu = () => {
    const rect = btnRef.current?.getBoundingClientRect();
    if (rect) {
      let left = rect.left;
      // Evita que el menú se salga por la derecha de la pantalla
      if (left + MENU_WIDTH > window.innerWidth - 8) {
        left = Math.max(8, window.innerWidth - MENU_WIDTH - 8);
      }
      let top = rect.bottom + 4;
      const MENU_HEIGHT = 88; // altura aproximada del menú (2 opciones)
      // Si no cabe debajo, lo abre hacia arriba
      if (top + MENU_HEIGHT > window.innerHeight - 8) {
        top = Math.max(8, rect.top - MENU_HEIGHT - 4);
      }
      setMenuPos({ top, left });
    }
    setMenuOpen(true);
  };

  const btnClass = `inline-flex items-center gap-1.5 rounded-md border border-stone-300 bg-white font-medium text-stone-700 hover:bg-stone-50 active:scale-[0.98] transition ${
    small ? "px-2.5 py-1.5 text-xs" : "px-3 py-2 text-sm"
  }`;

  return (
    <div className="inline-block">
      <input
        ref={cameraRef}
        type="file"
        accept="image/*"
        capture="environment"
        onChange={handleChange}
        style={{ display: "none" }}
      />
      <input
        ref={galleryRef}
        type="file"
        accept="image/*"
        onChange={handleChange}
        style={{ display: "none" }}
      />
      <button
        ref={btnRef}
        type="button"
        onClick={() => (menuOpen ? setMenuOpen(false) : openMenu())}
        disabled={loading}
        className={btnClass}
      >
        <Camera size={small ? 22 : 18} />
        {loading ? "Cargando..." : label}
      </button>

      {menuOpen && !loading && createPortal(
        <>
          <div className="fixed inset-0 z-40" onClick={() => setMenuOpen(false)} />
          <div
            className="fixed z-50 bg-white rounded-lg border border-stone-200 shadow-lg overflow-hidden w-48"
            style={{ top: menuPos.top, left: menuPos.left }}
          >
            <button
              type="button"
              onClick={() => {
                setMenuOpen(false);
                cameraRef.current?.click();
              }}
              className="w-full flex items-center gap-2.5 px-3.5 py-3.5 text-sm font-medium text-stone-700 hover:bg-stone-50 text-left"
            >
              <Camera size={20} /> Hacer foto
            </button>
            <button
              type="button"
              onClick={() => {
                setMenuOpen(false);
                galleryRef.current?.click();
              }}
              className="w-full flex items-center gap-2.5 px-3.5 py-3.5 text-sm font-medium text-stone-700 hover:bg-stone-50 text-left border-t border-stone-100"
            >
              <Package size={20} /> Elegir de galería
            </button>
          </div>
        </>,
        document.body
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Componente: visor de foto ampliada (lightbox)
   - Recibe TODAS las fotos de la orden (coche, cliente, piezas)
     mezcladas en un único array, sin separarlas por categoría.
   - Se desliza con el dedo entre todas ellas.
   - Si la foto pertenece a una pieza con proveedor asignado,
     lo muestra arriba mientras se está viendo esa foto.
--------------------------------------------------------- */
function ImageLightbox({ photos, index, onClose, onIndexChange }) {
  const [scale, setScale] = useState(1);
  const [translate, setTranslate] = useState({ x: 0, y: 0 });
  const pinchRef = useRef({ active: false, startDist: 0, startScale: 1 });
  const panRef = useRef({ active: false, startX: 0, startY: 0, startTranslate: { x: 0, y: 0 } });
  const swipeRef = useRef({ active: false, startX: 0, startY: 0, dx: 0 });
  const lastTapRef = useRef(0);

  const current = photos && photos[index];
  const fullPhoto = useFullPhoto(current);

  useEffect(() => {
    setScale(1);
    setTranslate({ x: 0, y: 0 });
  }, [index]);

  if (!current) return null;

  const src = fullPhoto.src;
  const supplier = current.supplier;

  const goTo = (newIndex) => {
    if (!photos.length) return;
    const clamped = Math.max(0, Math.min(photos.length - 1, newIndex));
    if (clamped !== index) onIndexChange(clamped);
  };

  const getDistance = (touches) => {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  };

  const clampScale = (s) => Math.min(Math.max(s, 1), 5);

  const handleTouchStart = (e) => {
    if (e.touches.length === 2) {
      pinchRef.current = {
        active: true,
        startDist: getDistance(e.touches),
        startScale: scale,
      };
    } else if (e.touches.length === 1) {
      if (scale > 1) {
        panRef.current = {
          active: true,
          startX: e.touches[0].clientX,
          startY: e.touches[0].clientY,
          startTranslate: { ...translate },
        };
      } else {
        swipeRef.current = {
          active: true,
          startX: e.touches[0].clientX,
          startY: e.touches[0].clientY,
          dx: 0,
        };
        const now = Date.now();
        if (now - lastTapRef.current < 300) {
          setScale(2.5);
        }
        lastTapRef.current = now;
      }
    }
  };

  const handleTouchMove = (e) => {
    if (e.touches.length === 2 && pinchRef.current.active) {
      e.preventDefault();
      const dist = getDistance(e.touches);
      const ratio = dist / (pinchRef.current.startDist || dist);
      setScale(clampScale(pinchRef.current.startScale * ratio));
    } else if (e.touches.length === 1 && panRef.current.active && scale > 1) {
      e.preventDefault();
      const dx = e.touches[0].clientX - panRef.current.startX;
      const dy = e.touches[0].clientY - panRef.current.startY;
      setTranslate({
        x: panRef.current.startTranslate.x + dx,
        y: panRef.current.startTranslate.y + dy,
      });
    } else if (e.touches.length === 1 && swipeRef.current.active && scale <= 1) {
      const dx = e.touches[0].clientX - swipeRef.current.startX;
      const dy = e.touches[0].clientY - swipeRef.current.startY;
      if (Math.abs(dx) > Math.abs(dy)) {
        e.preventDefault();
        swipeRef.current.dx = dx;
        setTranslate({ x: dx, y: 0 });
      }
    }
  };

  const handleTouchEnd = (e) => {
    if (e.touches.length < 2) pinchRef.current.active = false;
    if (e.touches.length < 1) panRef.current.active = false;
    if (e.touches.length === 0 && scale < 1.02) {
      if (swipeRef.current.active) {
        const dx = swipeRef.current.dx;
        swipeRef.current.active = false;
        if (Math.abs(dx) > 60) {
          if (dx < 0) goTo(index + 1);
          else goTo(index - 1);
        }
      }
      setScale(1);
      setTranslate({ x: 0, y: 0 });
    }
  };

  const handleShare = async (e) => {
    e.stopPropagation();
    try {
      const shareSrc = fullPhoto.full || src;
      const res = await fetch(shareSrc);
      const blob = await res.blob();
      const file = new File([blob], "foto.jpg", { type: blob.type || "image/jpeg" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else {
        // Alternativa si el navegador no admite compartir archivos:
        // se descarga la imagen para que el usuario la comparta manualmente.
        const link = document.createElement("a");
        link.href = shareSrc;
        link.download = "foto.jpg";
        link.click();
      }
    } catch (err) {
      if (err && err.name !== "AbortError") {
        console.error("No se pudo compartir la imagen:", err);
      }
    }
  };

  return createPortal(
    <div
      className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 overflow-hidden touch-none"
      onClick={onClose}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      <img
        src={src}
        alt=""
        onClick={(e) => e.stopPropagation()}
        draggable={false}
        style={{
          transform: `translate(${translate.x}px, ${translate.y}px) scale(${scale})`,
          transition: pinchRef.current.active || panRef.current.active || swipeRef.current.active ? "none" : "transform 0.15s ease-out",
        }}
        className="max-w-full max-h-full rounded-lg select-none touch-none"
      />

      {(fullPhoto.loading || fullPhoto.failed) && (
        <div
          className="absolute bottom-14 left-1/2 -translate-x-1/2 bg-white/15 backdrop-blur-sm text-white text-xs font-bold px-3 py-1.5 rounded-full border border-white/20 whitespace-nowrap"
          onClick={(e) => e.stopPropagation()}
        >
          {fullPhoto.loading ? "Cargando foto…" : "Vista previa · foto completa aún no disponible"}
        </div>
      )}

      {supplier ? (
        <div
          className="absolute top-4 left-1/2 -translate-x-1/2 bg-white/15 backdrop-blur-sm text-white text-xs font-bold uppercase tracking-wide px-3 py-1.5 rounded-full border border-white/20"
          onClick={(e) => e.stopPropagation()}
        >
          Proveedor: {supplier}
        </div>
      ) : null}

      {photos.length > 1 && (
        <div
          className="absolute bottom-5 left-1/2 -translate-x-1/2 text-white/70 text-xs font-medium flex items-center gap-2"
          onClick={(e) => e.stopPropagation()}
        >
          <span>Desliza con el dedo para ver más fotos</span>
          <span className="text-white/50">
            {index + 1}/{photos.length}
          </span>
        </div>
      )}

      <button
        className="absolute top-4 left-4 text-white bg-white/10 rounded-full p-2"
        onClick={handleShare}
        aria-label="Compartir imagen"
      >
        <Share2 size={20} />
      </button>
      <button
        className="absolute top-4 right-4 text-white bg-white/10 rounded-full p-2"
        onClick={onClose}
      >
        <X size={20} />
      </button>
    </div>,
    document.body
  );
}
